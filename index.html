<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大明郑和宝船 · 3D 数字沙盘（img2threejs 重构版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #040914; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Top Left Header Card */
    #hud-header {
      position: absolute; top: 20px; left: 24px; z-index: 10;
      background: rgba(8, 14, 26, 0.82); border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.2);
      border-radius: 14px; padding: 20px 26px; backdrop-filter: blur(16px);
      max-width: 400px; pointer-events: auto;
    }
    #hud-header h1 { font-size: 24px; font-weight: 700; color: #fdf6d8; letter-spacing: 2px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    #hud-header h1 span { font-size: 12px; font-weight: 600; color: #0a0f1d; background: #d4af37; padding: 2px 8px; border-radius: 4px; letter-spacing: 1px; }
    #hud-header p { font-size: 13px; color: #94a3b8; line-height: 1.65; margin-bottom: 14px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 3px 9px; background: rgba(212, 175, 55, 0.12); border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 6px; color: #f3e5ab; }

    /* Part Detail Floating Card */
    #info-panel {
      position: absolute; top: 20px; right: 24px; z-index: 10;
      background: rgba(8, 14, 26, 0.88); border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 14px; padding: 22px; backdrop-filter: blur(16px);
      width: 330px; display: none; pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      animation: fadeInRight 0.3s ease-out;
    }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    #info-panel .close-btn { position: absolute; top: 14px; right: 16px; background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    #info-panel .close-btn:hover { color: #fff; }
    #info-panel h3 { font-size: 18px; color: #fdf6d8; margin-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.25); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    #info-panel p { font-size: 13px; color: #cbd5e1; line-height: 1.7; }
    #info-panel .part-tag { display: inline-block; margin-top: 10px; font-size: 11px; color: #38bdf8; background: rgba(56,189,248,0.12); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(56,189,248,0.3); }

    /* Bottom Floating Action Bar */
    #controls {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; align-items: center; gap: 14px;
      background: rgba(8, 14, 26, 0.88); border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.7);
      border-radius: 50px; padding: 10px 24px; backdrop-filter: blur(16px);
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0; padding: 8px 18px; border-radius: 24px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; gap: 6px;
    }
    .ctrl-btn:hover { background: rgba(212, 175, 55, 0.3); border-color: #d4af37; color: #fff; transform: translateY(-2px); }
    .ctrl-btn.active { background: #d4af37; border-color: #d4af37; color: #0a0f1d; font-weight: 700; }
    
    .slider-group { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #e2e8f0; padding: 0 10px; }
    .slider-group input[type="range"] { width: 110px; accent-color: #d4af37; cursor: pointer; }

    /* Loading Screen */
    #loading {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
      background: #040914; display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.6s ease;
    }
    .spinner { width: 55px; height: 55px; border: 3px solid rgba(212,175,55,0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loading p { font-size: 16px; color: #fdf6d8; letter-spacing: 2px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>正在渲染郑和宝船高精 3D 数字模型...</p>
  </div>

  <div id="canvas-container"></div>

  <div id="hud-header">
    <h1>郑和宝船 <span>明代旗舰</span></h1>
    <p>基于最新重绘插画高精 3D 还原：福船V型船体、帝王金龙首像、歇山顶殿堂楼阁、双层侧舷火炮与竹筋硬帆。</p>
    <div class="tags">
      <span class="tag">福船船体</span>
      <span class="tag">立体金龙</span>
      <span class="tag">双檐歇山顶</span>
      <span class="tag">侧舷双层炮门</span>
      <span class="tag">竹筋硬帆</span>
      <span class="tag">爆炸拆解</span>
    </div>
  </div>

  <div id="info-panel">
    <button class="close-btn" onclick="closeInfoPanel()">×</button>
    <h3 id="info-title">📍 部件名称</h3>
    <p id="info-desc">部件详细信息描述...</p>
    <span class="part-tag" id="info-tag">三维建模组件</span>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btn-rotate" onclick="toggleAutoRotate()">🔄 自动旋转</button>
    <button class="ctrl-btn" id="btn-wireframe" onclick="toggleWireframe()">🕸️ 线框模式</button>
    <div class="slider-group">
      <span>💥 结构爆炸</span>
      <input type="range" id="explode-slider" min="0" max="1" step="0.01" value="0" oninput="onExplodeChange(this.value)">
    </div>
    <button class="ctrl-btn" id="btn-reset" onclick="resetCamera()">🎯 复位视角</button>
  </div>

  <script>
    // --- 1. Scene, Camera, Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060b17);
    scene.fog = new THREE.FogExp2(0x060b17, 0.0028);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 1000);
    camera.position.set(48, 28, 58);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.03;
    controls.minDistance = 12;
    controls.maxDistance = 190;
    controls.target.set(0, 9, 0);

    // --- 2. Lighting System ---
    const ambientLight = new THREE.AmbientLight(0xdce6f5, 0.8);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff0cc, 2.6);
    sunLight.position.set(65, 50, 45);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 220;
    const shadowDist = 55;
    sunLight.shadow.camera.left = -shadowDist;
    sunLight.shadow.camera.right = shadowDist;
    sunLight.shadow.camera.top = shadowDist;
    sunLight.shadow.camera.bottom = -shadowDist;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0x7095c2, 1.1);
    fillLight.position.set(-55, 35, -35);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xe5ba36, 1.4);
    rimLight.position.set(0, 25, -65);
    scene.add(rimLight);

    // --- 3. Physical Ocean Water ---
    const oceanGeo = new THREE.PlaneGeometry(600, 600, 140, 140);
    const oceanMat = new THREE.MeshStandardMaterial({
      color: 0x0a223d,
      roughness: 0.12,
      metalness: 0.88,
      flatShading: true
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = 0;
    scene.add(ocean);

    const wavePos = oceanGeo.attributes.position;

    // --- 4. Materials ---
    const woodHullMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.72, metalness: 0.08 });
    const woodDeckMat = new THREE.MeshStandardMaterial({ color: 0x6e5239, roughness: 0.78, metalness: 0.05 });
    const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x221610, roughness: 0.85, metalness: 0.1 });
    const goldMat = new THREE.MeshStandardMaterial({ color: 0xe6bb36, roughness: 0.3, metalness: 0.92 });
    const redVermilionMat = new THREE.MeshStandardMaterial({ color: 0xa82828, roughness: 0.45, metalness: 0.1 });
    const bluePaintMat = new THREE.MeshStandardMaterial({ color: 0x1d5a6c, roughness: 0.55, metalness: 0.1 });
    const yellowTileMat = new THREE.MeshStandardMaterial({ color: 0xebad26, roughness: 0.22, metalness: 0.35 });
    const sailRedMat = new THREE.MeshStandardMaterial({ color: 0x8c3832, roughness: 0.88, metalness: 0.05, side: THREE.DoubleSide });
    const sailCreamMat = new THREE.MeshStandardMaterial({ color: 0xccb697, roughness: 0.88, metalness: 0.05, side: THREE.DoubleSide });
    const cannonMetalMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.35, metalness: 0.88 });

    const shipParts = [];
    const mainShipGroup = new THREE.Group();
    scene.add(mainShipGroup);

    function registerPart(group, name, description, category, explodeDir) {
      group.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      group.userData = {
        name: name,
        description: description,
        category: category || "3D组件",
        origPos: group.position.clone(),
        explodeDir: explodeDir || new THREE.Vector3(0, 0, 0)
      };
      shipParts.push(group);
      return group;
    }

    // --- 5. High-Precision Geometry Procedural Sculpting ---

    // (A) HULL SYSTEM (福船V型首尖尾宽底 + 搭接板)
    const hullGroup = new THREE.Group();
    mainShipGroup.add(hullGroup);

    const hullLength = 54;
    const hullWidth = 15;
    const hullHeight = 11.5;
    const hullSegments = 20;
    const hullGeo = new THREE.BufferGeometry();
    const vertices = [];
    const indices = [];

    for (let i = 0; i <= hullSegments; i++) {
      const t = i / hullSegments; // 0 to 1
      const z = (t - 0.5) * hullLength;
      let wFactor = Math.sin(t * Math.PI * 0.85);
      if (t > 0.82) wFactor *= (1 - (t - 0.82) * 2.0); // sharp bow
      const w = hullWidth * 0.5 * (0.32 + 0.68 * wFactor);

      const yBottom = Math.pow(Math.abs(t - 0.42), 2) * 3.5 + 1.2;
      const yTop = yBottom + hullHeight * (0.85 + 0.28 * Math.pow(t - 0.5, 2));

      vertices.push(
        0, yBottom, z,          // 0: Bottom keel
        w, yTop, z,             // 1: Top Right
        w * 0.42, yBottom + 1.2, z, // 2: Mid V Right
        -w * 0.42, yBottom + 1.2, z,// 3: Mid V Left
        -w, yTop, z             // 4: Top Left
      );
    }

    for (let i = 0; i < hullSegments; i++) {
      const b = i * 5;
      const n = (i + 1) * 5;
      indices.push(b+0, b+2, n+2); indices.push(b+0, n+2, n+0);
      indices.push(b+2, b+1, n+1); indices.push(b+2, n+1, n+2);
      indices.push(b+0, n+3, b+3); indices.push(b+0, n+0, n+3);
      indices.push(b+3, n+4, b+4); indices.push(b+3, n+3, n+4);
    }

    hullGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
    hullGeo.setIndex(indices);
    hullGeo.computeVertexNormals();

    const mainHullMesh = new THREE.Mesh(hullGeo, woodHullMat);
    hullGroup.add(mainHullMesh);

    // Ribs & Wales
    for (let yOffset of [4.8, 7.5, 10.0]) {
      const waleMesh = new THREE.Mesh(new THREE.BoxGeometry(hullWidth + 0.7, 0.45, hullLength - 2), darkWoodMat);
      waleMesh.position.set(0, yOffset, 0);
      hullGroup.add(waleMesh);
    }

    // Side Decorative Color Trims (彩绘饰带)
    for (let side of [-1, 1]) {
      const trimMesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, hullLength - 8), redVermilionMat);
      trimMesh.position.set(side * (hullWidth * 0.48), 10.8, 0);
      hullGroup.add(trimMesh);
    }

    registerPart(hullGroup, "福船基底船体", "典型中式福船线型：吃水深、首尖尾宽、V型底抗浪，配备重叠木板结构与船侧二方连续彩绘饰带。", "船体主结构", new THREE.Vector3(0, -2.5, 0));

    // (B) GUN PORTS & CANNONS (侧舷双层火炮群)
    const cannonGroup = new THREE.Group();
    mainShipGroup.add(cannonGroup);
    for (let z = -13; z <= 13; z += 5.5) {
      for (let side of [-1, 1]) {
        for (let yLevel of [5.8, 8.6]) {
          const portCover = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.95, 0.95), redVermilionMat);
          const xPos = side * (hullWidth * 0.47);
          portCover.position.set(xPos, yLevel, z);
          cannonGroup.add(portCover);

          const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 1.5, 12), cannonMetalMat);
          cannon.rotation.z = Math.PI / 2;
          cannon.position.set(xPos + side * 0.45, yLevel - 0.1, z);
          cannonGroup.add(cannon);
        }
      }
    }
    registerPart(cannonGroup, "侧舷双层火炮阵列", "左右侧舷两层共计数十门火炮，配有红色防护炮门盖板，为远航提供强大防护火力。", "火炮系统", new THREE.Vector3(3.5, 0, 0));

    // (C) BOW & GOLDEN DRAGON FIGUREHEAD (船首金龙像 + 铁锚)
    const bowGroup = new THREE.Group();
    bowGroup.position.set(0, 10.5, 25);
    mainShipGroup.add(bowGroup);

    const dragonBase = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.2, 3.8), goldMat);
    dragonBase.position.set(0, 1.2, 1.5);
    bowGroup.add(dragonBase);

    const snout = new THREE.Mesh(new THREE.ConeGeometry(1.3, 3.0, 4), goldMat);
    snout.rotation.x = Math.PI / 2;
    snout.position.set(0, 1.7, 4.0);
    bowGroup.add(snout);

    for (let side of [-1, 1]) {
      const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.35, 2.4, 8), goldMat);
      horn.rotation.x = -Math.PI / 4;
      horn.rotation.z = side * Math.PI / 6;
      horn.position.set(side * 0.85, 2.9, 2.4);
      bowGroup.add(horn);

      const anchor = new THREE.Group();
      const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.2, 8), cannonMetalMat);
      anchor.add(shank);
      const fluke = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.12, 8, 16, Math.PI), cannonMetalMat);
      fluke.rotation.x = Math.PI / 2;
      fluke.position.y = -1.3;
      anchor.add(fluke);
      anchor.position.set(side * 5.4, -1.8, 1.5);
      bowGroup.add(anchor);
    }
    registerPart(bowGroup, "船首立体金龙首像", "雕刻威严的立体帝王金龙首，龙须张扬，下方挂载四爪铁锚与金属锚链，象征远航威仪。", "船首饰件", new THREE.Vector3(0, 2, 5));

    // (D) STERN CASTLE & THREE-TIER PAVILION (尾楼3层平台 + 双檐歇山顶阁楼)
    const sternGroup = new THREE.Group();
    sternGroup.position.set(0, 11, -16.5);
    mainShipGroup.add(sternGroup);

    const tier1Base = new THREE.Mesh(new THREE.BoxGeometry(13.8, 4.2, 14.5), woodHullMat);
    tier1Base.position.set(0, 2.1, 0);
    sternGroup.add(tier1Base);

    const tier2Base = new THREE.Mesh(new THREE.BoxGeometry(11.8, 3.6, 11.2), redVermilionMat);
    tier2Base.position.set(0, 6.0, -0.5);
    sternGroup.add(tier2Base);

    for (let z of [-4.2, 0, 4.2]) {
      for (let side of [-1, 1]) {
        const column = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 3.6, 12), redVermilionMat);
        column.position.set(side * 5.3, 6.0, z);
        sternGroup.add(column);
      }
    }

    const hallBody = new THREE.Mesh(new THREE.BoxGeometry(8.8, 3.4, 8.2), bluePaintMat);
    hallBody.position.set(0, 9.5, -0.5);
    sternGroup.add(hallBody);

    const dougongGroup = new THREE.Group();
    for (let x = -4.0; x <= 4.0; x += 1.2) {
      for (let side of [-1, 1]) {
        const block = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.65), goldMat);
        block.position.set(x, 11.3, side * 3.9);
        dougongGroup.add(block);
      }
    }
    sternGroup.add(dougongGroup);

    function createXieshanRoof(width, depth, height) {
      const roofGroup = new THREE.Group();
      const roofGeo = new THREE.ConeGeometry(Math.max(width, depth) * 0.76, height, 4);
      roofGeo.rotateY(Math.PI / 4);
      const roofMesh = new THREE.Mesh(roofGeo, yellowTileMat);
      roofGroup.add(roofMesh);

      for (let corner of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
        const eaveTip = new THREE.Mesh(new THREE.ConeGeometry(0.28, 1.6, 4), goldMat);
        eaveTip.rotation.x = corner[1] * Math.PI / 4;
        eaveTip.rotation.z = -corner[0] * Math.PI / 4;
        eaveTip.position.set(corner[0] * (width * 0.53), -height * 0.32, corner[1] * (depth * 0.53));
        roofGroup.add(eaveTip);
      }
      return roofGroup;
    }

    const lowerRoof = createXieshanRoof(11.5, 10.5, 2.4);
    lowerRoof.position.set(0, 11.7, -0.5);
    sternGroup.add(lowerRoof);

    const upperRoof = createXieshanRoof(8.8, 7.8, 2.8);
    upperRoof.position.set(0, 13.8, -0.5);
    sternGroup.add(upperRoof);

    registerPart(sternGroup, "尾楼三层歇山顶殿堂楼阁", "尾楼连升3层，顶层为双檐歇山顶建筑，配备黄琉璃瓦、斗拱模块层、朱红立柱与观景外廊。", "尾楼建筑", new THREE.Vector3(0, 5, -6));

    // Wooden Rudder (船尾悬挂木舵)
    const rudderGroup = new THREE.Group();
    const rudderBlade = new THREE.Mesh(new THREE.BoxGeometry(0.55, 8.5, 3.8), darkWoodMat);
    rudderBlade.position.set(0, 4.2, -25.2);
    rudderGroup.add(rudderBlade);
    mainShipGroup.add(rudderGroup);
    registerPart(rudderGroup, "尾部开孔悬挂木舵", "巨大的中式悬挂木舵，舵叶带有开孔，可通过绞盘灵活升降调节吃水深度。", "船舵系统", new THREE.Vector3(0, -1.5, -4.5));

    // (E) MASTS, SAILS & RIGGING (5根木桅杆 + 竹筋硬帆 + 绳网)
    const mastsGroup = new THREE.Group();
    mainShipGroup.add(mastsGroup);

    const mastConfigs = [
      { name: "船首斜桅", pos: [0, 21, 23, 0.4, 0.25], rotX: -Math.PI / 8, sailType: 'cream' },
      { name: "前桅杆", pos: [0, 10.5, 34, 0.55, 0.3], rotX: 0, sailType: 'red' },
      { name: "主桅杆", pos: [0, -3.2, 42, 0.72, 0.4], rotX: 0, sailType: 'red' },
      { name: "中桅杆", pos: [0, -12.5, 35, 0.6, 0.35], rotX: 0, sailType: 'red' },
      { name: "尾桅杆", pos: [0, -21.5, 25, 0.45, 0.25], rotX: Math.PI / 12, sailType: 'cream' }
    ];

    const sailsList = [];

    mastConfigs.forEach((config, idx) => {
      const mastSubGroup = new THREE.Group();
      mastSubGroup.position.set(config.pos[0], 10.5, config.pos[1]);
      if (config.rotX) mastSubGroup.rotation.x = config.rotX;
      mastsGroup.add(mastSubGroup);

      const mastHeight = config.pos[2];
      const mastPole = new THREE.Mesh(new THREE.CylinderGeometry(config.pos[4], config.pos[3], mastHeight, 16), darkWoodMat);
      mastPole.position.y = mastHeight / 2;
      mastSubGroup.add(mastPole);

      const nest = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 0.95, 0.85, 12), woodDeckMat);
      nest.position.y = mastHeight * 0.65;
      mastSubGroup.add(nest);

      const sailW = mastHeight * 0.43;
      const sailH = mastHeight * 0.62;
      const sailGeo = new THREE.PlaneGeometry(sailW, sailH, 18, 18);
      
      const posAttr = sailGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const u = (posAttr.getX(i) / sailW) + 0.5;
        const v = (posAttr.getY(i) / sailH) + 0.5;
        const zBulge = Math.sin(v * Math.PI) * Math.sin(u * Math.PI) * 2.8;
        posAttr.setZ(i, zBulge);
      }
      sailGeo.computeVertexNormals();

      const chosenSailMat = (config.sailType === 'red') ? sailRedMat : sailCreamMat;
      const sailMesh = new THREE.Mesh(sailGeo, chosenSailMat);
      sailMesh.position.set(0, mastHeight * 0.55, 1.3);
      mastSubGroup.add(sailMesh);
      sailsList.push(sailMesh);

      for (let yRatio of [-0.35, -0.18, 0, 0.18, 0.35]) {
        const batten = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, sailW + 0.4, 8), darkWoodMat);
        batten.rotation.z = Math.PI / 2;
        batten.position.set(0, mastHeight * 0.55 + yRatio * sailH, 1.6);
        mastSubGroup.add(batten);
      }

      const flagGeo = new THREE.PlaneGeometry(3.4, 1.9, 8, 4);
      const flagMat = new THREE.MeshStandardMaterial({ color: idx % 2 === 0 ? 0xc02c2d : 0xe6bb36, side: THREE.DoubleSide });
      const flagMesh = new THREE.Mesh(flagGeo, flagMat);
      flagMesh.position.set(1.7, mastHeight + 0.95, 0);
      mastSubGroup.add(flagMesh);

      registerPart(mastSubGroup, `${config.name}与中式硬帆`, `包含多节木桅杆、瞭望斗𪤗、横向竹筋加固的顺风硬帆面与桅顶飘扬帅旗。`, "桅帆系统", new THREE.Vector3(0, 4, 0));
    });

    // Ratlines (索具绳网)
    const riggingGroup = new THREE.Group();
    mainShipGroup.add(riggingGroup);

    for (let mastZ of [10.5, -3.2, -12.5]) {
      for (let side of [-1, 1]) {
        const points = [];
        const topP = new THREE.Vector3(side * 0.85, 31, mastZ);
        const botP1 = new THREE.Vector3(side * 6.8, 10.5, mastZ - 4.2);
        const botP2 = new THREE.Vector3(side * 6.8, 10.5, mastZ + 4.2);
        for (let step = 0; step <= 9; step++) {
          const t = step / 9;
          const leftP = new THREE.Vector3().lerpVectors(topP, botP1, t);
          const rightP = new THREE.Vector3().lerpVectors(topP, botP2, t);
          points.push(leftP, rightP);
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const ratlines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x4a3b2c }));
        riggingGroup.add(ratlines);
      }
    }

    mainShipGroup.position.y = 1.2;

    // Hide Loading
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 600);

    // --- 6. Raycasting Interaction ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
      if (event.target.closest('#hud-header') || event.target.closest('#info-panel') || event.target.closest('#controls')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      let found = null;
      for (let part of shipParts) {
        const intersects = raycaster.intersectObjects(part.children, true);
        if (intersects.length > 0) {
          found = part;
          break;
        }
      }

      if (found) {
        showInfoPanel(found.userData.name, found.userData.description, found.userData.category);
      }
    });

    function showInfoPanel(title, desc, cat) {
      const panel = document.getElementById('info-panel');
      document.getElementById('info-title').innerText = "📍 " + title;
      document.getElementById('info-desc').innerText = desc;
      document.getElementById('info-tag').innerText = cat;
      panel.style.display = 'block';
    }

    function closeInfoPanel() {
      document.getElementById('info-panel').style.display = 'none';
    }

    // --- 7. Controls & Explode Animation ---
    let autoRotate = false;
    function toggleAutoRotate() {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.5;
      document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
    }

    let wireframeMode = false;
    function toggleWireframe() {
      wireframeMode = !wireframeMode;
      scene.traverse((child) => {
        if (child.isMesh && child !== ocean) {
          child.material.wireframe = wireframeMode;
        }
      });
      document.getElementById('btn-wireframe').classList.toggle('active', wireframeMode);
    }

    function onExplodeChange(val) {
      const factor = parseFloat(val);
      shipParts.forEach((part) => {
        if (part.userData.origPos && part.userData.explodeDir) {
          const targetPos = part.userData.origPos.clone().add(part.userData.explodeDir.clone().multiplyScalar(factor * 3.8));
          part.position.copy(targetPos);
        }
      });
    }

    function resetCamera() {
      controls.reset();
      camera.position.set(48, 28, 58);
      controls.target.set(0, 9, 0);
      document.getElementById('explode-slider').value = 0;
      onExplodeChange(0);
      closeInfoPanel();
    }

    // --- 8. Animation & Render Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // (A) Ocean Wave Motion
      for (let i = 0; i < wavePos.count; i++) {
        const u = wavePos.getX(i);
        const v = wavePos.getY(i);
        const z = Math.sin(u * 0.08 + elapsedTime * 1.6) * 0.45 + Math.cos(v * 0.08 + elapsedTime * 1.3) * 0.45;
        wavePos.setZ(i, z);
      }
      oceanGeo.attributes.position.needsUpdate = true;

      // (B) Ship Bobbing & Rolling
      mainShipGroup.position.y = 1.2 + Math.sin(elapsedTime * 1.2) * 0.5;
      mainShipGroup.rotation.z = Math.sin(elapsedTime * 0.85) * 0.038;
      mainShipGroup.rotation.x = Math.cos(elapsedTime * 0.95) * 0.028;

      // (C) Sail Flutter
      sailsList.forEach((sail, idx) => {
        sail.rotation.y = Math.sin(elapsedTime * 2.2 + idx) * 0.025;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- 9. Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
