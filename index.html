<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郑和宝船 · Zheng He Treasure Ship · img2threejs v3</title>
<style>
  body { margin:0; overflow:hidden; background:#1a1a2e; font-family:'SimSun',serif; }
  #info { position:absolute; top:20px; left:20px; color:#c9a96e; font-size:18px; text-shadow:0 0 10px rgba(0,0,0,0.8); }
  #info small { font-size:12px; opacity:0.7; display:block; }
  #controls { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#888; font-size:11px; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="info">郑和宝船 <small>Zheng He Treasure Ship · img2threejs v3</small></div>
<div id="controls">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// SCENE SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a2a3a');
scene.fog = new THREE.Fog('#1a2a3a', 20, 80);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.5, 200);
camera.position.set(8, 5, 14);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.7;
controls.update();

// ============================================================
// LIGHTING
// ============================================================
const ambientLight = new THREE.AmbientLight('#3a4a5a', 1.2);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight('#fff5e8', 4.5);
sunLight.position.set(15, 20, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 60;
sunLight.shadow.camera.left = -15;
sunLight.shadow.camera.right = 15;
sunLight.shadow.camera.top = 15;
sunLight.shadow.camera.bottom = -5;
sunLight.shadow.bias = -0.0001;
sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight('#8ab4d8', 1.5);
fillLight.position.set(-5, 3, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight('#ffd4a0', 2.0);
rimLight.position.set(0, 2, -8);
scene.add(rimLight);

// ============================================================
// MATERIALS
// ============================================================
// Hull wood
const hullWoodMat = new THREE.MeshStandardMaterial({
  color: '#6B4226',
  roughness: 0.65,
  metalness: 0.02,
  name: 'hullWood'
});

const hullWoodDarkMat = new THREE.MeshStandardMaterial({
  color: '#4A2C14',
  roughness: 0.7,
  metalness: 0.02,
  name: 'hullWoodDark'
});

// Deck wood
const deckWoodMat = new THREE.MeshStandardMaterial({
  color: '#8B6914',
  roughness: 0.6,
  metalness: 0.03,
  name: 'deckWood'
});

// Superstructure wood (darker, more refined)
const superstructureWoodMat = new THREE.MeshStandardMaterial({
  color: '#5C3A1E',
  roughness: 0.55,
  metalness: 0.05,
  name: 'superstructureWood'
});

// Roof tiles (dark grey/blue)
const roofTileMat = new THREE.MeshStandardMaterial({
  color: '#2C3E50',
  roughness: 0.5,
  metalness: 0.1,
  name: 'roofTile'
});

// Mast wood
const mastWoodMat = new THREE.MeshStandardMaterial({
  color: '#5C3317',
  roughness: 0.7,
  metalness: 0.02,
  name: 'mastWood'
});

// Sail cloth (deep red)
const sailMat = new THREE.MeshStandardMaterial({
  color: '#8B1A1A',
  roughness: 0.75,
  metalness: 0.0,
  side: THREE.DoubleSide,
  name: 'sailCloth'
});

// Gold dragon head
const dragonGoldMat = new THREE.MeshStandardMaterial({
  color: '#DAA520',
  roughness: 0.25,
  metalness: 0.9,
  name: 'dragonGold'
});

// Gold trim
const goldTrimMat = new THREE.MeshStandardMaterial({
  color: '#C8A840',
  roughness: 0.3,
  metalness: 0.85,
  name: 'goldTrim'
});

// Flag material
const flagRedMat = new THREE.MeshStandardMaterial({
  color: '#CC0000',
  roughness: 0.65,
  metalness: 0.0,
  side: THREE.DoubleSide,
  name: 'flagRed'
});

const flagYellowMat = new THREE.MeshStandardMaterial({
  color: '#DAA520',
  roughness: 0.6,
  metalness: 0.0,
  side: THREE.DoubleSide,
  name: 'flagYellow'
});

// Ocean
const oceanMat = new THREE.MeshStandardMaterial({
  color: '#1a5276',
  roughness: 0.3,
  metalness: 0.2,
  name: 'ocean'
});

// ============================================================
// HELPER: createGroup
// ============================================================
function createGroup(name, parent) {
  const g = new THREE.Group();
  g.name = name;
  if (parent) parent.add(g);
  return g;
}

// ============================================================
// MAIN SHIP GROUP
// ============================================================
const ship = createGroup('zheng-he-treasure-ship');
scene.add(ship);

// ============================================================
// 1. HULL
// ============================================================
const hullGroup = createGroup('hull', ship);

// Main hull body — elongated box
const hullLength = 10;
const hullWidth = 2.2;
const hullHeight = 1.8;

const hullGeo = new THREE.BoxGeometry(hullLength, hullHeight, hullWidth, 30, 8, 6);

// Taper the bow and stern
const hullPositions = hullGeo.attributes.position;
for (let i = 0; i < hullPositions.count; i++) {
  const x = hullPositions.getX(i);
  const y = hullPositions.getY(i);
  const z = hullPositions.getZ(i);

  // Normalize x to [-1,1] range
  const xn = x / (hullLength / 2);

  // Bottom narrowing (V-shape hull)
  const yNorm = (y + hullHeight/2) / hullHeight; // 0 at bottom, 1 at top
  const bottomNarrow = 0.4 + yNorm * 0.6;

  // Bow (front) narrowing
  let bowFactor = 1.0;
  if (xn > 0.6) {
    bowFactor = 1.0 - (xn - 0.6) / 0.4 * 0.7;
  }
  // Stern narrowing
  if (xn < -0.7) {
    const sternT = (-0.7 - xn) / 0.3;
    bowFactor *= 1.0 - sternT * 0.5;
  }

  hullPositions.setZ(i, z * bottomNarrow * bowFactor);
}
hullGeo.computeVertexNormals();

const hullMesh = new THREE.Mesh(hullGeo, hullWoodMat);
hullMesh.castShadow = true;
hullMesh.receiveShadow = true;
hullMesh.position.y = 0.9;
hullGroup.add(hullMesh);

// Hull bottom dark strip
const hullBottomGeo = new THREE.BoxGeometry(hullLength * 0.95, 0.15, hullWidth * 0.6, 20, 1, 4);
const hullBottom = new THREE.Mesh(hullBottomGeo, hullWoodDarkMat);
hullBottom.position.y = 0.05;
hullBottom.castShadow = true;
hullGroup.add(hullBottom);

// Bow extension — raised prow
const prowGeo = new THREE.BoxGeometry(1.2, 0.8, 1.0, 6, 4, 4);
const prowPositions = prowGeo.attributes.position;
for (let i = 0; i < prowPositions.count; i++) {
  const x = prowPositions.getX(i);
  const xn = (x + 0.6) / 1.2; // 0 at back, 1 at front
  prowPositions.setY(i, prowPositions.getY(i) + xn * 0.4);
  prowPositions.setZ(i, prowPositions.getZ(i) * (1.0 - xn * 0.5));
}
prowGeo.computeVertexNormals();

const prowMesh = new THREE.Mesh(prowGeo, hullWoodMat);
prowMesh.position.set(hullLength/2 + 0.3, 1.2, 0);
prowMesh.castShadow = true;
hullGroup.add(prowMesh);

// ============================================================
// 2. DECK
// ============================================================
const deckGroup = createGroup('deck', hullMesh);

const deckGeo = new THREE.BoxGeometry(hullLength * 0.88, 0.12, hullWidth * 0.78, 20, 1, 6);
const deckMesh = new THREE.Mesh(deckGeo, deckWoodMat);
deckMesh.position.y = hullHeight/2 + 0.06;
deckMesh.receiveShadow = true;
deckMesh.castShadow = true;
deckGroup.add(deckMesh);

// Deck railing — port and starboard
function createRailing(x, z, length) {
  const railGroup = createGroup('railing', deckMesh);

  // Top rail
  const railGeo = new THREE.CylinderGeometry(0.04, 0.04, length, 6);
  const rail = new THREE.Mesh(railGeo, deckWoodMat);
  rail.rotation.z = Math.PI/2;
  rail.position.set(x, 0.4, z);
  rail.castShadow = true;
  railGroup.add(rail);

  // Posts
  const postCount = Math.floor(length / 0.5);
  for (let i = 0; i < postCount; i++) {
    const postGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.35, 6);
    const post = new THREE.Mesh(postGeo, deckWoodMat);
    post.position.set(x - length/2 + i * (length/(postCount-1)), 0.22, z);
    post.castShadow = true;
    railGroup.add(post);
  }

  return railGroup;
}

createRailing(0, hullWidth * 0.36, hullLength * 0.85);
createRailing(0, -hullWidth * 0.36, hullLength * 0.85);

// ============================================================
// 3. DRAGON HEAD (bow figurehead)
// ============================================================
const dragonGroup = createGroup('dragonHead', ship);
dragonGroup.position.set(hullLength/2 + 0.9, 1.6, 0);

// Neck
const neckGeo = new THREE.CylinderGeometry(0.25, 0.35, 0.8, 8);
const neckMesh = new THREE.Mesh(neckGeo, dragonGoldMat);
neckMesh.rotation.x = Math.PI/2;
neckMesh.position.set(-0.3, 0, 0);
neckMesh.castShadow = true;
dragonGroup.add(neckMesh);

// Head main
const headGeo = new THREE.SphereGeometry(0.35, 12, 10);
// Elongate
const headPositions = headGeo.attributes.position;
for (let i = 0; i < headPositions.count; i++) {
  headPositions.setX(i, headPositions.getX(i) * 1.4);
  headPositions.setY(i, headPositions.getY(i) * 0.75);
}
headGeo.computeVertexNormals();

const headMesh = new THREE.Mesh(headGeo, dragonGoldMat);
headMesh.position.set(0.25, -0.05, 0);
headMesh.castShadow = true;
dragonGroup.add(headMesh);

// Upper jaw
const upperJawGeo = new THREE.BoxGeometry(0.5, 0.1, 0.2, 6, 2, 4);
const jawPositions = upperJawGeo.attributes.position;
for (let i = 0; i < jawPositions.count; i++) {
  const xn = (jawPositions.getX(i) + 0.25) / 0.5;
  jawPositions.setY(i, jawPositions.getY(i) + xn * 0.15);
  if (xn > 0.5) jawPositions.setZ(i, jawPositions.getZ(i) * (1.0 - (xn-0.5)*2*0.4));
}
upperJawGeo.computeVertexNormals();

const upperJaw = new THREE.Mesh(upperJawGeo, dragonGoldMat);
upperJaw.position.set(0.55, 0.15, 0);
upperJaw.castShadow = true;
dragonGroup.add(upperJaw);

// Lower jaw
const lowerJawGeo = new THREE.BoxGeometry(0.4, 0.08, 0.16, 6, 2, 4);
const ljPositions = lowerJawGeo.attributes.position;
for (let i = 0; i < ljPositions.count; i++) {
  const xn = (ljPositions.getX(i) + 0.2) / 0.4;
  if (xn > 0.5) ljPositions.setZ(i, ljPositions.getZ(i) * (1.0 - (xn-0.5)*2*0.3));
}
lowerJawGeo.computeVertexNormals();

const lowerJaw = new THREE.Mesh(lowerJawGeo, dragonGoldMat);
lowerJaw.position.set(0.5, -0.1, 0);
lowerJaw.castShadow = true;
dragonGroup.add(lowerJaw);

// Teeth
for (let i = 0; i < 4; i++) {
  const toothGeo = new THREE.ConeGeometry(0.025, 0.08, 4);
  const tooth = new THREE.Mesh(toothGeo, new THREE.MeshStandardMaterial({color:'#FFFFF0', roughness:0.2, metalness:0.1}));
  tooth.position.set(0.72, 0.08, -0.06 + i * 0.04);
  tooth.rotation.z = -0.3;
  tooth.castShadow = true;
  dragonGroup.add(tooth);
}

// Eyes
for (let side = -1; side <= 1; side += 2) {
  const eyeGeo = new THREE.SphereGeometry(0.06, 8, 8);
  const eyeMat = new THREE.MeshStandardMaterial({color:'#FF0000', roughness:0.1, metalness:0.5, emissive:'#330000', emissiveIntensity:0.5});
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(0.35, 0.08, side * 0.22);
  dragonGroup.add(eye);
}

// Horns/whiskers
for (let side = -1; side <= 1; side += 2) {
  const whiskerGeo = new THREE.CylinderGeometry(0.02, 0.06, 0.7, 6);
  const whisker = new THREE.Mesh(whiskerGeo, dragonGoldMat);
  whisker.position.set(0.15, 0.0, side * 0.18);
  whisker.rotation.z = side * 0.5;
  whisker.rotation.x = -0.3;
  whisker.castShadow = true;
  dragonGroup.add(whisker);
}

// ============================================================
// 4. DECK SUPERSTRUCTURE (Pagoda-style)
// ============================================================
const superstructureGroup = createGroup('superstructure', deckMesh);
superstructureGroup.position.set(-1.5, 0.2, 0);

function createPagodaTier(yOffset, width, depth, height) {
  const tier = createGroup('tier', superstructureGroup);

  // Main room body
  const roomGeo = new THREE.BoxGeometry(width, height, depth, 8, 4, 6);
  const room = new THREE.Mesh(roomGeo, superstructureWoodMat);
  room.position.y = yOffset + height/2;
  room.castShadow = true;
  room.receiveShadow = true;
  tier.add(room);

  // Eaves/roof — curved 歇山顶 style
  const roofOverhang = 0.35;
  const roofGeo = new THREE.BoxGeometry(width + roofOverhang*2, 0.15, depth + roofOverhang*2, 10, 2, 8);
  const roofPositions = roofGeo.attributes.position;
  for (let i = 0; i < roofPositions.count; i++) {
    const xn = Math.abs(roofPositions.getX(i)) / (width/2 + roofOverhang);
    const roofY = roofPositions.getY(i);
    if (roofY > 0) {
      roofPositions.setY(i, roofY + xn * xn * 0.25);
    }
  }
  roofGeo.computeVertexNormals();

  const roof = new THREE.Mesh(roofGeo, roofTileMat);
  roof.position.y = yOffset + height + 0.08;
  roof.castShadow = true;
  roof.receiveShadow = true;
  tier.add(roof);

  // Ridge decoration
  const ridgeGeo = new THREE.BoxGeometry(width + roofOverhang*1.5, 0.06, 0.12);
  const ridge = new THREE.Mesh(ridgeGeo, goldTrimMat);
  ridge.position.y = yOffset + height + 0.22;
  ridge.castShadow = true;
  tier.add(ridge);

  // Eave brackets (dougong style suggestion)
  for (let side = -1; side <= 1; side += 2) {
    for (let bx = -width/2; bx <= width/2; bx += width/3) {
      const bracketGeo = new THREE.BoxGeometry(0.08, 0.08, 0.15);
      const bracket = new THREE.Mesh(bracketGeo, superstructureWoodMat);
      bracket.position.set(bx, yOffset + height - 0.02, side * (depth/2 + 0.05));
      bracket.castShadow = true;
      tier.add(bracket);
    }
  }

  // Windows/doors on front face
  for (let wx = -width/3; wx <= width/3; wx += width/1.5) {
    const windowGeo = new THREE.PlaneGeometry(0.25, 0.35);
    const windowMat = new THREE.MeshStandardMaterial({
      color: '#1a0a00',
      roughness: 0.3,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    const windowMesh = new THREE.Mesh(windowGeo, windowMat);
    windowMesh.position.set(wx, yOffset + height*0.55, depth/2 + 0.01);
    tier.add(windowMesh);

    // Window frame
    const frameGeo = new THREE.BoxGeometry(0.28, 0.38, 0.03);
    const frame = new THREE.Mesh(frameGeo, goldTrimMat);
    frame.position.set(wx, yOffset + height*0.55, depth/2 + 0.02);
    frame.castShadow = true;
    tier.add(frame);
  }

  return tier;
}

// Three-tier pagoda (each tier slightly smaller)
createPagodaTier(0, 2.2, 1.4, 1.0);
createPagodaTier(1.05, 1.8, 1.15, 0.85);
createPagodaTier(1.95, 1.4, 0.9, 0.7);

// ============================================================
// 5. MAST SYSTEM
// ============================================================
const mastSystem = createGroup('mastSystem', deckMesh);

const mastConfigs = [
  { x: 2.8, height: 5.5, sailW: 1.2, sailH: 2.8 },
  { x: 1.4, height: 6.2, sailW: 1.3, sailH: 3.0 },
  { x: 0.0, height: 6.5, sailW: 1.35, sailH: 3.2 },
  { x: -1.5, height: 5.8, sailW: 1.25, sailH: 2.9 },
];

mastConfigs.forEach((cfg, idx) => {
  const mastGroup = createGroup(`mast-${idx}`, mastSystem);

  // Mast pole
  const mastGeo = new THREE.CylinderGeometry(0.08, 0.12, cfg.height, 8);
  const mast = new THREE.Mesh(mastGeo, mastWoodMat);
  mast.position.set(cfg.x, cfg.height/2 + 0.2, 0);
  mast.castShadow = true;
  mast.receiveShadow = true;
  mastGroup.add(mast);

  // Yard arms (2 per mast)
  for (let yi = 0; yi < 2; yi++) {
    const yardY = 0.5 + yi * (cfg.height * 0.45);
    const yardGeo = new THREE.CylinderGeometry(0.04, 0.055, cfg.sailW * 1.3, 6);
    const yard = new THREE.Mesh(yardGeo, mastWoodMat);
    yard.rotation.z = Math.PI/2;
    yard.position.set(cfg.x, yardY, 0);
    yard.castShadow = true;
    mastGroup.add(yard);

    // Sail
    const sailGroup = createGroup(`sail-${idx}-${yi}`, mastGroup);
    sailGroup.position.set(cfg.x, yardY - cfg.sailH/2, 0);

    // Sail — curved plane
    const sailGeo = new THREE.PlaneGeometry(cfg.sailW * 1.2, cfg.sailH, 12, 16);
    const sailPositions = sailGeo.attributes.position;
    for (let i = 0; i < sailPositions.count; i++) {
      const yNorm = sailPositions.getY(i) / (cfg.sailH/2);
      sailPositions.setZ(i, sailPositions.getZ(i) + yNorm * yNorm * 0.3);
      // Wind billow
      sailPositions.setZ(i, sailPositions.getZ(i) + (1 - Math.abs(yNorm)) * 0.4);
    }
    sailGeo.computeVertexNormals();

    const sailMesh = new THREE.Mesh(sailGeo, sailMat);
    sailMesh.position.y = cfg.sailH/2;
    sailMesh.castShadow = true;
    sailMesh.receiveShadow = true;
    sailGroup.add(sailMesh);

    // Panel seams
    for (let si = -1; si <= 1; si += 1) {
      const seamGeo = new THREE.BoxGeometry(0.015, cfg.sailH, 0.01);
      const seam = new THREE.Mesh(seamGeo, new THREE.MeshStandardMaterial({
        color: '#6B1010', roughness: 0.8, metalness: 0
      }));
      seam.position.set(si * cfg.sailW * 0.35, cfg.sailH/2, 0.01);
      sailGroup.add(seam);
    }
  }

  // Flag at mast top
  const flagGroup = createGroup(`flag-${idx}`, mastGroup);
  flagGroup.position.set(cfg.x, cfg.height + 0.1, 0);

  // Flag pole extension
  const flagPoleGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.6, 6);
  const flagPole = new THREE.Mesh(flagPoleGeo, mastWoodMat);
  flagPole.position.y = 0.3;
  flagGroup.add(flagPole);

  // Flag banner
  const flagW = 0.5;
  const flagH = 0.35;
  const flagMatChoice = idx === 0 ? flagYellowMat : (idx % 2 === 0 ? flagRedMat : flagYellowMat);
  const flagGeo = new THREE.PlaneGeometry(flagW, flagH, 4, 3);
  const flagPositions = flagGeo.attributes.position;
  for (let i = 0; i < flagPositions.count; i++) {
    const xn = (flagPositions.getX(i) + flagW/2) / flagW;
    flagPositions.setZ(i, flagPositions.getZ(i) + Math.sin(xn * Math.PI * 2) * 0.06);
  }
  flagGeo.computeVertexNormals();

  const flagBanner = new THREE.Mesh(flagGeo, flagMatChoice);
  flagBanner.position.set(flagW/2 + 0.05, 0.45, 0);
  flagBanner.castShadow = true;
  flagGroup.add(flagBanner);

  // Flag text decal (大明 / 鄭和)
  const textGeo = new THREE.PlaneGeometry(flagW * 0.6, flagH * 0.3);
  const textMat = new THREE.MeshStandardMaterial({
    color: idx === 0 ? '#000000' : '#000000',
    roughness: 0.5,
    metalness: 0,
    side: THREE.DoubleSide
  });
  const textDecal = new THREE.Mesh(textGeo, textMat);
  textDecal.position.set(flagW/2 + 0.06, 0.45, 0.005);
  flagGroup.add(textDecal);
});

// ============================================================
// 6. STERN CASTLE
// ============================================================
const sternGroup = createGroup('sternCastle', deckMesh);
sternGroup.position.set(-hullLength/2 + 1.2, 0.5, 0);

const sternBaseGeo = new THREE.BoxGeometry(1.5, 0.9, hullWidth * 0.65, 6, 4, 4);
const sternBase = new THREE.Mesh(sternBaseGeo, superstructureWoodMat);
sternBase.position.y = 0.45;
sternBase.castShadow = true;
sternBase.receiveShadow = true;
sternGroup.add(sternBase);

// Stern roof
const sternRoofGeo = new THREE.BoxGeometry(1.8, 0.1, hullWidth * 0.7, 6, 1, 4);
const sternRoof = new THREE.Mesh(sternRoofGeo, roofTileMat);
sternRoof.position.y = 0.95;
sternRoof.castShadow = true;
sternGroup.add(sternRoof);

// ============================================================
// 7. OCEAN BASE
// ============================================================
const oceanGeo = new THREE.CylinderGeometry(8, 9, 0.15, 32);
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.position.y = -0.4;
ocean.receiveShadow = true;
scene.add(ocean);

// Water rings
for (let i = 0; i < 3; i++) {
  const ringGeo = new THREE.TorusGeometry(7.5 + i * 0.5, 0.03, 8, 48);
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({
    color: '#2980b9', roughness: 0.2, metalness: 0.3
  }));
  ring.rotation.x = Math.PI/2;
  ring.position.y = -0.32 + i * 0.01;
  ring.receiveShadow = true;
  scene.add(ring);
}

// ============================================================
// 8. ANCHOR
// ============================================================
const anchorGroup = createGroup('anchor', hullMesh);
anchorGroup.position.set(hullLength/2 - 0.5, -0.3, hullWidth/2 - 0.1);

const anchorShaftGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.6, 6);
const anchorShaft = new THREE.Mesh(anchorShaftGeo, new THREE.MeshStandardMaterial({
  color: '#333333', roughness: 0.4, metalness: 0.85
}));
anchorShaft.position.y = 0.3;
anchorGroup.add(anchorShaft);

// Anchor ring
const anchorRingGeo = new THREE.TorusGeometry(0.12, 0.025, 6, 8);
const anchorRing = new THREE.Mesh(anchorRingGeo, new THREE.MeshStandardMaterial({
  color: '#444444', roughness: 0.35, metalness: 0.9
}));
anchorRing.position.y = 0.6;
anchorGroup.add(anchorRing);

// Anchor cross arms
const anchorArmGeo = new THREE.BoxGeometry(0.3, 0.04, 0.04);
const anchorArm = new THREE.Mesh(anchorArmGeo, new THREE.MeshStandardMaterial({
  color: '#3a3a3a', roughness: 0.4, metalness: 0.85
}));
anchorArm.position.y = -0.05;
anchorGroup.add(anchorArm);

// ============================================================
// RENDER LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Gentle ocean shimmer
  const t = Date.now() * 0.001;
  ocean.position.y = -0.4 + Math.sin(t * 0.8) * 0.03;

  renderer.render(scene, camera);
}

animate();

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('🚢 郑和宝船 · Zheng He Treasure Ship · ready');
console.log('Components: hull, dragon-head, pagoda-superstructure, 4-mast-system, sails, flags, stern-castle, anchor, ocean');
