<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>郑和宝船 · Three.js 程序化重建</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    #app { width: 100%; height: 100%; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(13, 17, 23, 0.82); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 16px; color: #e6edf3; backdrop-filter: blur(6px);
      max-width: 280px; pointer-events: none;
    }
    #hud h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    #hud p { font-size: 12px; color: #8b949e; line-height: 1.6; }
    #hud .tag {
      display: inline-block; margin-top: 6px; font-size: 11px; color: #d29922;
      border: 1px solid rgba(210,153,34,0.4); border-radius: 4px; padding: 1px 6px; margin-right: 4px;
    }
    #controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 8px; background: rgba(13,17,23,0.82); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px);
    }
    #controls button {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: #e6edf3;
      border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    #controls button:hover { background: rgba(255,255,255,0.16); }
    #controls button.active { background: rgba(56,139,253,0.4); border-color: #388bfd; }
  </style>
  <script type="module" crossorigin src="./assets/index-CDc9GDPl.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <h1>⚓ 郑和宝船 · Treasure Ship</h1>
    <p>福船型 · 3 桅 9 帆 · 三层歇山顶楼阁 · 金龙头</p>
    <span class="tag">大明</span><span class="tag">郑和</span>
  </div>
  <div id="controls">
    <button id="btn-rotate">旋转</button>
    <button id="btn-wire">线框</button>
    <button id="btn-explode">分解</button>
    <button id="btn-reset">复位</button>
  </div>
</body>
</html>
