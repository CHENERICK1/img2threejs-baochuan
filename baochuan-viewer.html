<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郑和宝船 - 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; font-family: 'SimSun', 'Noto Serif SC', serif; }
  canvas { display: block; }
  #info {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #d4a574; font-size: 28px; text-shadow: 0 0 20px rgba(212,165,116,0.5);
    pointer-events: none; z-index: 10;
  }
  #subtitle {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    color: #8b7355; font-size: 14px; letter-spacing: 4px;
    pointer-events: none; z-index: 10;
  }
  #controls {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 13px; pointer-events: none; z-index: 10;
    text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<div id="info">郑 和 宝 船</div>
<div id="subtitle">明 · 永 乐 年 间 · 下 西 洋</div>
<div id="controls">🖱 拖拽旋转 &nbsp;|&nbsp; 📜 滚轮缩放 &nbsp;|&nbsp; 👆 右键平移</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 15, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 100);
camera.position.set(8, 3.5, 14);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.8;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffeedd, 0.7));
const sun = new THREE.DirectionalLight(0xfff5e8, 4);
sun.position.set(10, 14, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -5;
sun.shadow.bias = -0.0001;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x8899cc, 1));
scene.add(new THREE.DirectionalLight(0xffffff, 1.2));
scene.add(new THREE.DirectionalLight(0x334466, 0.5));

// Materials (from GLM-4.6V analysis)
const hullMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.65, metalness: 0.05 });
const hullAccent = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.6, metalness: 0.05 });
const deckMat = new THREE.MeshStandardMaterial({ color: 0xA0724A, roughness: 0.55, metalness: 0.03 });
const sailMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.75, metalness: 0.0, side: THREE.DoubleSide });
const sailRib = new THREE.MeshStandardMaterial({ color: 0x6B1010, roughness: 0.65, metalness: 0.05 });
const mastMat = new THREE.MeshStandardMaterial({ color: 0x4A2F10, roughness: 0.55, metalness: 0.05 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xDAA520, roughness: 0.3, metalness: 0.6 });
const redRail = new THREE.MeshStandardMaterial({ color: 0xCC0000, roughness: 0.45, metalness: 0.1 });
const buildingRed = new THREE.MeshStandardMaterial({ color: 0xCC2222, roughness: 0.4, metalness: 0.1 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x1A0A05, roughness: 0.5, metalness: 0.05 });
const blueAccent = new THREE.MeshStandardMaterial({ color: 0x2244AA, roughness: 0.4, metalness: 0.15 });

const ship = new THREE.Group();
const L = 10; // ship length

// ======== HULL ========
function createHull() {
  const g = new THREE.Group();
  const W = L * 0.28;

  // Main hull body
  const hGeo = new THREE.BoxGeometry(L * 0.88, 0.7, W * 0.72, 4, 2, 4);
  const pos = hGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    pos.setXYZ(i, x * (1 - Math.abs(x/(L*0.44))*0.55), y < -0.2 ? -0.2-(y+0.2)*0.4*(1-Math.abs(x/(L*0.44))) : y, z*(y<0?1:0.8));
  }
  hGeo.computeVertexNormals();
  const hull = new THREE.Mesh(hGeo, hullMat);
  hull.position.y = -0.1;
  hull.castShadow = hull.receiveShadow = true;
  g.add(hull);

  // Bottom keel
  const keel = new THREE.Mesh(new THREE.BoxGeometry(L*0.92, 0.35, 0.45), hullAccent);
  keel.position.y = -0.55;
  keel.castShadow = keel.receiveShadow = true;
  g.add(keel);

  // Bulwark (舷墙)
  const bw = new THREE.Mesh(new THREE.BoxGeometry(L*0.85, 0.4, W*0.65, 4, 1, 2), hullAccent);
  bw.position.y = 0.35;
  bw.castShadow = bw.receiveShadow = true;
  g.add(bw);

  // Bow extension
  const bowTip = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.6, 8, 4), hullMat);
  bowTip.rotation.x = Math.PI/2;
  bowTip.position.set(L*0.48, -0.15, 0);
  bowTip.scale.set(1,1,0.65);
  bowTip.castShadow = true;
  g.add(bowTip);

  // Rudder (船舵)
  const rud = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2, 1), hullAccent);
  rud.position.set(-L*0.43, -1.1, 0);
  rud.castShadow = true;
  g.add(rud);

  return g;
}

// ======== GOLDEN DRAGON HEAD PROW ========
function createDragonHead() {
  const g = new THREE.Group();

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.9, 8), goldMat);
  neck.rotation.x = -0.35;
  neck.position.set(L*0.51, 0.65, 0);
  neck.castShadow = true;
  g.add(neck);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 6), goldMat);
  head.position.set(L*0.56, 1.05, 0);
  head.scale.set(1.15, 0.85, 0.75);
  head.castShadow = true;
  g.add(head);

  // Snout
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.1, 0.22), goldMat);
  snout.position.set(L*0.59, 0.95, 0);
  snout.castShadow = true;
  g.add(snout);

  // Lower jaw
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.2), goldMat);
  jaw.position.set(L*0.59, 0.78, -0.04);
  jaw.castShadow = true;
  g.add(jaw);

  // Eyes
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), new THREE.MeshStandardMaterial({color:0xFF0000,roughness:0.2,emissive:0x440000}));
  [-0.18, 0.18].forEach(z => {
    const e = new THREE.Mesh(eye.geometry, eye.material);
    e.position.set(L*0.575, 1.15, z);
    g.add(e);
  });

  // Curled whiskers
  [-0.22, 0.22].forEach(z => {
    const wGeo = new THREE.TorusGeometry(0.25, 0.04, 6, 8, Math.PI*0.8);
    const w = new THREE.Mesh(wGeo, goldMat);
    w.position.set(L*0.58, 0.82, z);
    w.rotation.x = 0.5;
    w.rotation.z = z > 0 ? -0.4 : 0.4;
    w.rotation.y = Math.PI/2;
    g.add(w);
  });

  // Horns
  [-0.2, 0.2].forEach(z => {
    const h = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.45, 6), goldMat);
    h.position.set(L*0.54, 1.35, z);
    h.rotation.z = 0.5;
    h.rotation.x = z > 0 ? 0.25 : -0.25;
    g.add(h);
  });

  // Scales
  for (let i = 0; i < 5; i++) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.25), goldMat);
    s.position.set(L*0.52, 0.85 - i*0.12, 0);
    g.add(s);
  }

  return g;
}

// ======== MASTS (4 masts, deep red sails) ========
function createMasts() {
  const g = new THREE.Group();
  const mastData = [
    { pos: 0.15, h: 4.2, sails: 1 },
    { pos: 0.35, h: 4.8, sails: 2 },
    { pos: 0.55, h: 5.2, sails: 2 },
    { pos: 0.75, h: 4.5, sails: 1 },
  ];

  mastData.forEach(m => {
    const x = (m.pos - 0.5) * L * 0.78;
    const baseY = 0.6;

    // Mast pole
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, m.h, 8), mastMat);
    pole.position.set(x, baseY + m.h/2, 0);
    pole.castShadow = pole.receiveShadow = true;
    g.add(pole);

    // Yardarms
    for (let j = 0; j < m.sails; j++) {
      const yy = baseY + m.h * (0.2 + j * (0.7 / m.sails));
      const yw = 1.0 + j * 0.1;
      const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, yw, 6).rotateZ(Math.PI/2), mastMat);
      yard.position.set(x, yy, 0);
      yard.castShadow = true;
      g.add(yard);
    }

    // Sails - deep red Chinese lug sails
    for (let j = 0; j < m.sails; j++) {
      const sailH = m.h * 0.28;
      const sailW = 0.95;
      const sGeo = new THREE.PlaneGeometry(sailW, sailH, 3, 6);
      const sp = sGeo.attributes.position;
      for (let k = 0; k < sp.count; k++) {
        sp.setZ(k, Math.abs(sp.getX(k)) * 0.1 + sp.getY(k) * 0.02);
      }
      sGeo.computeVertexNormals();
      const sail = new THREE.Mesh(sGeo, sailMat);
      sail.position.set(x, baseY + m.h * (0.2 + (j+0.5) * (0.7/m.sails)), 0);
      sail.castShadow = sail.receiveShadow = true;
      g.add(sail);

      // Bamboo battens
      for (let b = 0; b < 5; b++) {
        const by = baseY + m.h * (0.2 + (j*0.7/m.sails) + (b+0.5)*((0.7/m.sails)/5));
        const batten = new THREE.Mesh(new THREE.BoxGeometry(sailW*1.04, 0.025, 0.03), sailRib);
        batten.position.set(x, by, 0.01);
        g.add(batten);
      }
    }
  });
  return g;
}

// ======== CENTRAL BUILDING (3-story xieshan roof) ========
function createCentralBuilding() {
  const g = new THREE.Group();
  const tiers = [
    { y: 0.65, w: 2.2, d: 2.0, h: 1.1 },
    { y: 1.95, w: 1.8, d: 1.6, h: 1.0 },
    { y: 3.15, w: 1.4, d: 1.2, h: 0.9 },
  ];

  tiers.forEach(t => {
    // Wall frame - red
    const wall = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), buildingRed);
    wall.position.set(0, t.y + t.h/2, 0);
    wall.castShadow = wall.receiveShadow = true;
    g.add(wall);

    // Blue/gold decorative panels on walls
    for (let s = 0; s < 2; s++) {
      const sz = s === 0 ? t.d/2 + 0.01 : -(t.d/2 + 0.01);
      const panel = new THREE.Mesh(new THREE.BoxGeometry(t.w*0.7, t.h*0.4, 0.02), blueAccent);
      panel.position.set(0, t.y + t.h/2, sz);
      g.add(panel);
    }

    // Xieshan roof (歇山顶)
    const roofW = t.w + 0.8;
    const roofD = t.d + 0.8;
    const roof = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.12, roofD), roofMat);
    roof.position.set(0, t.y + t.h + 0.08, 0);
    roof.castShadow = roof.receiveShadow = true;
    g.add(roof);

    // Upturned eaves (飞檐)
    for (let c = 0; c < 4; c++) {
      const a = c*Math.PI/2 + Math.PI/4;
      const ex = Math.cos(a) * (roofW/2 + 0.15);
      const ez = Math.sin(a) * (roofD/2 + 0.15);
      const eave = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 6), roofMat);
      eave.position.set(ex, t.y + t.h + 0.2, ez);
      eave.rotation.z = Math.PI;
      eave.castShadow = true;
      g.add(eave);
    }

    // Gold trim on roof edge
    for (let s = 0; s < 2; s++) {
      const sz = s === 0 ? roofD/2 + 0.02 : -(roofD/2 + 0.02);
      const trim = new THREE.Mesh(new THREE.BoxGeometry(roofW*0.95, 0.03, 0.04), goldMat);
      trim.position.set(0, t.y + t.h + 0.16, sz);
      g.add(trim);
    }

    // Corner pillars
    for (let p = 0; p < 4; p++) {
      const px = (p%2===0?-1:1)*t.w/2*0.85;
      const pz = (p<2?-1:1)*t.d/2*0.85;
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, t.h-0.05, 6), buildingRed);
      pillar.position.set(px, t.y + t.h/2, pz);
      g.add(pillar);
    }
  });

  // Top finial
  const finial = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 6), goldMat);
  finial.position.set(0, 4.35, 0);
  g.add(finial);

  return g;
}

// ======== STERN PLATFORM (2-level elevated) ========
function createSternPlatform() {
  const g = new THREE.Group();

  for (let i = 0; i < 2; i++) {
    const y = 0.65 + i * 1.0;
    const w = 1.8 - i * 0.3;
    const d = 1.6 - i * 0.25;
    const h = 0.5;

    const plat = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), hullAccent);
    plat.position.set(-L*0.32, y + h/2, 0);
    plat.castShadow = plat.receiveShadow = true;
    g.add(plat);

    // Red railings
    for (let s = 0; s < 2; s++) {
      const sz = s === 0 ? d/2 : -d/2;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(w*0.9, 0.06, 0.04), redRail);
      rail.position.set(-L*0.32, y + h + 0.1, sz);
      g.add(rail);
      // Gold pattern dots on rails
      for (let dg = 0; dg < 6; dg++) {
        const dx = (-L*0.32 - w*0.4) + dg * (w*0.8/5);
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 4), goldMat);
        dot.position.set(dx, y + h + 0.14, sz);
        g.add(dot);
      }
    }
    for (let s = 0; s < 2; s++) {
      const sx = s === 0 ? -L*0.32 + w/2 : -L*0.32 - w/2;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, d*0.9), redRail);
      rail.position.set(sx, y + h + 0.1, 0);
      g.add(rail);
    }
  }
  return g;
}

// ======== DECK WITH RED RAILINGS ========
function createDeck() {
  const g = new THREE.Group();
  const W = L * 0.28;

  // Main deck
  const deck = new THREE.Mesh(new THREE.BoxGeometry(L*0.82, 0.06, W*0.55), deckMat);
  deck.position.y = 0.5;
  deck.receiveShadow = true;
  g.add(deck);

  // Deck planks
  for (let i = 0; i < 14; i++) {
    const px = (i/13 - 0.5) * L * 0.8;
    const plank = new THREE.Mesh(new THREE.BoxGeometry(L*0.8/14*0.9, 0.008, W*0.5), deckMat);
    plank.position.set(px, 0.54, 0);
    g.add(plank);
  }

  // Red railings with gold patterns
  for (let side = 0; side < 2; side++) {
    const sz = side === 0 ? W*0.28 : -W*0.28;
    // Rail bar
    const rail = new THREE.Mesh(new THREE.BoxGeometry(L*0.8, 0.06, 0.05), redRail);
    rail.position.set(0, 0.72, sz);
    g.add(rail);

    // Posts
    for (let r = 0; r < 16; r++) {
      const rx = (r/15 - 0.5) * L * 0.79;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3, 6), redRail);
      post.position.set(rx, 0.58, sz);
      g.add(post);
    }

    // Gold dot patterns on rails
    for (let d = 0; d < 12; d++) {
      const dx = (d/11 - 0.5) * L * 0.76;
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.025, 4, 4), goldMat);
      dot.position.set(dx, 0.75, sz);
      g.add(dot);
    }
  }
  return g;
}

// ======== FLAGS ========
function createFlags() {
  const g = new THREE.Group();

  // Bow flag - large red
  const bowPole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2, 8), mastMat);
  bowPole.position.set(L*0.45, 1.6, 0);
  g.add(bowPole);

  const flagGeo = new THREE.PlaneGeometry(0.6, 0.35);
  const bigRedFlag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({color:0xCC0000, roughness:0.4, side:THREE.DoubleSide}));
  bigRedFlag.position.set(L*0.46, 2.5, 0);
  bigRedFlag.rotation.z = 0.1;
  g.add(bigRedFlag);

  // "大明" flag (larger red)
  const daMing = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), new THREE.MeshStandardMaterial({color:0xCC0000, roughness:0.4, side:THREE.DoubleSide}));
  daMing.position.set(L*0.35, 2.6, 0.15);
  daMing.rotation.z = 0.12;
  daMing.rotation.y = 0.15;
  g.add(daMing);

  // "郑和" flag
  const zhengHeFlag = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.28), new THREE.MeshStandardMaterial({color:0xBB0000, roughness:0.4, side:THREE.DoubleSide}));
  zhengHeFlag.position.set(L*0.38, 2.5, -0.12);
  zhengHeFlag.rotation.z = 0.08;
  zhengHeFlag.rotation.y = -0.1;
  g.add(zhengHeFlag);

  return g;
}

// ======== ANCHOR & WINCH ========
function createEquipment() {
  const g = new THREE.Group();
  const ironMat = new THREE.MeshStandardMaterial({color:0x333333, roughness:0.35, metalness:0.8});

  // Anchor
  const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.3, 8), ironMat);
  shank.position.set(L*0.38, -0.1, W*0.15);
  shank.rotation.z = 0.25;
  g.add(shank);

  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.07), ironMat);
  arm.position.set(L*0.37, -0.75, W*0.15);
  arm.rotation.z = 0.25;
  g.add(arm);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 8, 8), ironMat);
  ring.position.set(L*0.4, 0.3, W*0.15);
  g.add(ring);

  // Winch (绞盘)
  const winchBase = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.15, 8), hullAccent);
  winchBase.position.set(L*0.1, 0.45, W*0.1);
  g.add(winchBase);
  const winchDrum = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.35, 8), mastMat);
  winchDrum.position.set(L*0.1, 0.65, W*0.1);
  g.add(winchDrum);

  return g;
}

// Ground plane
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 32),
  new THREE.MeshStandardMaterial({color:0x0a1628, roughness:0.9, metalness:0.3, transparent:true, opacity:0.35})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2;
ground.receiveShadow = true;
scene.add(ground);

// Assemble ship
ship.add(createHull());
ship.add(createDragonHead());
ship.add(createMasts());
ship.add(createCentralBuilding());
ship.add(createSternPlatform());
ship.add(createDeck());
ship.add(createFlags());
ship.add(createEquipment());
scene.add(ship);

// Particles
const pGeo = new THREE.BufferGeometry();
const pArr = new Float32Array(200*3);
for (let i=0;i<pArr.length;i+=3) { pArr[i]=(Math.random()-.5)*18; pArr[i+1]=Math.random()*8-1; pArr[i+2]=(Math.random()-.5)*12; }
pGeo.setAttribute('position', new THREE.BufferAttribute(pArr,3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({size:0.03, color:0xffd700, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending}));
scene.add(particles);

// Animate
const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const t = performance.now()*0.001;
  controls.update();
  ship.rotation.z = Math.sin(t*0.4)*0.012;
  ship.position.y = Math.sin(t*0.5)*0.06;
  particles.rotation.y += clock.getDelta()*0.04;
  renderer.render(scene, camera);
})();

addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
