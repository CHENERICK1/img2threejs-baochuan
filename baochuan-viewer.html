<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郑和宝船 - 3D Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a1a; overflow:hidden; font-family:'SimSun','Noto Serif SC',serif; }
  canvas { display:block; }
  #info { position:absolute; top:20px; left:50%; transform:translateX(-50%); color:#d4a574; font-size:26px; text-shadow:0 0 20px rgba(212,165,116,0.5); pointer-events:none; z-index:10; letter-spacing:6px; }
  #sub { position:absolute; top:58px; left:50%; transform:translateX(-50%); color:#8b7355; font-size:13px; letter-spacing:3px; pointer-events:none; z-index:10; }
  #ctrl { position:absolute; bottom:25px; left:50%; transform:translateX(-50%); color:#666; font-size:12px; pointer-events:none; z-index:10; }
</style>
</head>
<body>
<div id="info">鄭 和 寶 船</div>
<div id="sub">明 · 永 樂 年 間 · 下 西 洋</div>
<div id="ctrl">🖱 拖拽旋轉 &nbsp;|&nbsp; 📜 滾輪縮放</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script>
// === SETUP ===
var W = window.innerWidth, H = window.innerHeight;
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.025);

var camera = new THREE.PerspectiveCamera(40, W/H, 0.5, 100);
camera.position.set(7, 4, 13);
camera.lookAt(0, 1.2, 0);

var renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.85;
controls.update();

// === LIGHTS ===
scene.add(new THREE.AmbientLight(0x445566, 0.6));
var sun = new THREE.DirectionalLight(0xffeedd, 3.5);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -4;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x7799cc, 0.8));
scene.add(new THREE.DirectionalLight(0xffffff, 0.6));

// === MATERIALS ===
var M = {};
M.hull = new THREE.MeshStandardMaterial({ color:0x7B3F1A, roughness:0.6, metalness:0.05 });
M.hullDark = new THREE.MeshStandardMaterial({ color:0x5A2E10, roughness:0.65, metalness:0.05 });
M.hullLight = new THREE.MeshStandardMaterial({ color:0x9B6B3D, roughness:0.5, metalness:0.03 });
M.deck = new THREE.MeshStandardMaterial({ color:0xA0724A, roughness:0.5, metalness:0.03 });
M.sail = new THREE.MeshStandardMaterial({ color:0x8B0000, roughness:0.7, metalness:0.0, side:THREE.DoubleSide });
M.sailRib = new THREE.MeshStandardMaterial({ color:0x6B1010, roughness:0.6, metalness:0.05 });
M.mast = new THREE.MeshStandardMaterial({ color:0x4A2F10, roughness:0.5, metalness:0.05 });
M.gold = new THREE.MeshStandardMaterial({ color:0xDAA520, roughness:0.25, metalness:0.6 });
M.red = new THREE.MeshStandardMaterial({ color:0xCC0000, roughness:0.4, metalness:0.1 });
M.roof = new THREE.MeshStandardMaterial({ color:0x1A0805, roughness:0.5, metalness:0.05 });
M.blue = new THREE.MeshStandardMaterial({ color:0x2244AA, roughness:0.35, metalness:0.15 });
M.iron = new THREE.MeshStandardMaterial({ color:0x333333, roughness:0.3, metalness:0.8 });
M.flag = new THREE.MeshStandardMaterial({ color:0xCC0000, roughness:0.4, side:THREE.DoubleSide });
M.flag2 = new THREE.MeshStandardMaterial({ color:0xBB0000, roughness:0.4, side:THREE.DoubleSide });

var ship = new THREE.Group();
var L = 10; // hull length scale
var W2 = L * 0.28; // hull width

// ============ HULL (LatheGeometry for smooth curved shape) ============
(function() {
  var pts = [];
  var n = 20;
  for (var i = 0; i <= n; i++) {
    var t = i / n;
    var x = (t - 0.5) * L * 0.95;
    // Width profile - widest at center, tapered at ends
    var taper = 1 - Math.pow(t*2-1, 2) * 0.75;
    var w = W2 * 0.6 * taper;
    // Height profile - deeper at center, shallower at ends
    var h = 0.65 * (1 - Math.pow(t*2-1, 4) * 0.7);
    pts.push(new THREE.Vector3(x, h, w));
  }
  
  // Left half
  var leftPts = pts.map(function(p) { return new THREE.Vector2(p.x, p.z); });
  var hullGeo = new THREE.LatheGeometry(leftPts, 5, 0, Math.PI);
  // Mirror for right half
  var hull2 = new THREE.Mesh(hullGeo, M.hull);
  hull2.position.y = -0.15;
  hull2.castShadow = hull2.receiveShadow = true;
  ship.add(hull2);
  
  // Bottom keel
  var keel = new THREE.Mesh(new THREE.BoxGeometry(L*0.9, 0.08, 0.08), M.hullDark);
  keel.position.y = -0.62;
  keel.castShadow = true;
  ship.add(keel);
  
  // Deck platform
  var deckPts = [];
  for (var i2 = 0; i2 <= n; i2++) {
    var t2 = i2 / n;
    var dx = (t2 - 0.5) * L * 0.88;
    var dw = W2 * 0.55 * (1 - Math.pow(t2*2-1, 2) * 0.65);
    deckPts.push(new THREE.Vector3(dx, 0.42, dw));
  }
  var deckShape = new THREE.Shape();
  deckPts.forEach(function(p, idx) {
    if (idx === 0) deckShape.moveTo(p.x, p.z);
    else deckShape.lineTo(p.x, p.z);
  });
  for (var i3 = n; i3 >= 0; i3--) {
    var p = deckPts[i3];
    deckShape.lineTo(p.x, -p.z);
  }
  deckShape.closePath();
  
  var deckGeo = new THREE.ShapeGeometry(deckShape);
  var deckMesh = new THREE.Mesh(deckGeo, M.deck);
  deckMesh.rotation.x = -Math.PI/2;
  deckMesh.position.y = 0.42;
  deckMesh.receiveShadow = true;
  ship.add(deckMesh);
})();

// ============ GOLDEN DRAGON HEAD ============
(function() {
  // Neck
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 0.8, 10), M.gold);
  neck.rotation.x = -0.3;
  neck.position.set(L*0.48, 0.55, 0);
  neck.castShadow = true;
  ship.add(neck);
  
  // Head
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 8), M.gold);
  head.position.set(L*0.51, 0.95, 0);
  head.scale.set(1.1, 0.8, 0.7);
  head.castShadow = true;
  ship.add(head);
  
  // Upper jaw
  var jaw = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.18), M.gold);
  jaw.position.set(L*0.54, 0.88, 0);
  jaw.castShadow = true;
  ship.add(jaw);
  
  // Lower jaw
  var lJaw = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.06, 0.16), M.gold);
  lJaw.position.set(L*0.54, 0.73, -0.03);
  lJaw.castShadow = true;
  ship.add(lJaw);
  
  // Eyes (red)
  var eyeMat = new THREE.MeshStandardMaterial({color:0xFF0000, emissive:0x440000});
  [-0.16, 0.16].forEach(function(z) {
    var e = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMat);
    e.position.set(L*0.525, 1.04, z);
    ship.add(e);
  });
  
  // Whiskers
  [-0.2, 0.2].forEach(function(z) {
    var w = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.035, 6, 8, Math.PI*0.7), M.gold);
    w.position.set(L*0.53, 0.78, z);
    w.rotation.x = 0.4; w.rotation.z = z > 0 ? -0.3 : 0.3; w.rotation.y = Math.PI/2;
    ship.add(w);
  });
  
  // Horns
  [-0.17, 0.17].forEach(function(z) {
    var h = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.4, 6), M.gold);
    h.position.set(L*0.495, 1.22, z);
    h.rotation.z = 0.4; h.rotation.x = z > 0 ? 0.2 : -0.2;
    ship.add(h);
  });
  
  // Scale plates
  for (var i = 0; i < 6; i++) {
    var s = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.22), M.gold);
    s.position.set(L*0.47, 0.8 - i*0.1, 0);
    ship.add(s);
  }
})();

// ============ 4 MASTS WITH DEEP RED SAILS ============
(function() {
  var mastData = [
    { pos: 0.15, h: 4.0, sails: 1, w: 0.75 },
    { pos: 0.35, h: 4.6, sails: 2, w: 0.85 },
    { pos: 0.55, h: 5.0, sails: 2, w: 0.85 },
    { pos: 0.75, h: 4.2, sails: 1, w: 0.75 },
  ];
  
  mastData.forEach(function(m) {
    var x = (m.pos - 0.5) * L * 0.78;
    var baseY = 0.45;
    
    // Mast pole with taper
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.08, m.h, 8), M.mast);
    pole.position.set(x, baseY + m.h/2, 0);
    pole.castShadow = true;
    ship.add(pole);
    
    // Sails & yards
    for (var j = 0; j < m.sails; j++) {
      var sailH = m.h * 0.22;
      var sailW = m.w * (1 - j * 0.1);
      var centerY = baseY + m.h * (0.18 + (j+0.5) * (0.64/m.sails));
      
      // Yardarm
      var yard = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, sailW * 1.1, 6).rotateZ(Math.PI/2), M.mast);
      yard.position.set(x, centerY, 0);
      ship.add(yard);
      
      // Sail with billow (curved surface)
      var sGeo = new THREE.PlaneGeometry(sailW, sailH, 5, 8);
      var sp = sGeo.attributes.position;
      for (var k = 0; k < sp.count; k++) {
        var sx = sp.getX(k), sy = sp.getY(k);
        // Billow: bulge out in the middle, more at bottom
        var swell = (1 - Math.abs(sy) / (sailH/2)) * (1 - Math.pow(Math.abs(sx)/(sailW/2), 2)) * 0.25;
        sp.setZ(k, swell - 0.03);
      }
      sGeo.computeVertexNormals();
      var sail = new THREE.Mesh(sGeo, M.sail);
      sail.position.set(x, centerY, 0);
      sail.castShadow = true;
      ship.add(sail);
      
      // Bamboo battens (horizontal strips)
      for (var b = 0; b < 5; b++) {
        var by = centerY - sailH/2 + (b+0.5) * (sailH/5);
        var batten = new THREE.Mesh(new THREE.BoxGeometry(sailW*1.03, 0.02, 0.05), M.sailRib);
        batten.position.set(x, by, 0.02);
        ship.add(batten);
      }
    }
  });
})();

// ============ CENTRAL 3-STORY BUILDING ============
(function() {
  var tiers = [
    { y: 0.5, w: 2.0, d: 1.8, h: 1.0 },
    { y: 1.7, w: 1.6, d: 1.4, h: 0.9 },
    { y: 2.8, w: 1.2, d: 1.0, h: 0.8 },
  ];
  
  tiers.forEach(function(t) {
    var wall = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), M.red);
    wall.position.set(0, t.y + t.h/2, 0);
    wall.castShadow = wall.receiveShadow = true;
    ship.add(wall);
    
    // Blue decorative panels
    [-1, 1].forEach(function(s) {
      var panel = new THREE.Mesh(new THREE.BoxGeometry(t.w*0.6, t.h*0.35, 0.015), M.blue);
      panel.position.set(0, t.y + t.h/2, s * (t.d/2 + 0.005));
      ship.add(panel);
    });
    
    // Roof (歇山顶)
    var rw = t.w + 0.6, rd = t.d + 0.6;
    var roof = new THREE.Mesh(new THREE.BoxGeometry(rw, 0.1, rd), M.roof);
    roof.position.set(0, t.y + t.h + 0.05, 0);
    roof.castShadow = true;
    ship.add(roof);
    
    // Upturned eaves
    for (var c = 0; c < 4; c++) {
      var a = c*Math.PI/2 + Math.PI/4;
      var eave = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 6), M.roof);
      eave.position.set(Math.cos(a)*(rw/2+0.1), t.y+t.h+0.15, Math.sin(a)*(rd/2+0.1));
      eave.rotation.z = Math.PI;
      ship.add(eave);
    }
    
    // Gold roof trim
    [-1, 1].forEach(function(s) {
      var trim = new THREE.Mesh(new THREE.BoxGeometry(rw*0.9, 0.02, 0.03), M.gold);
      trim.position.set(0, t.y + t.h + 0.12, s * (rd/2 + 0.01));
      ship.add(trim);
    });
    
    // Corner pillars
    for (var p = 0; p < 4; p++) {
      var pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, t.h-0.05, 6), M.red);
      pillar.position.set((p%2?1:-1)*t.w/2*0.8, t.y+t.h/2, (p<2?-1:1)*t.d/2*0.8);
      ship.add(pillar);
    }
  });
  
  // Top ornament
  var finial = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.35, 6), M.gold);
  finial.position.set(0, 3.9, 0);
  ship.add(finial);
})();

// ============ STERN PLATFORM (2-level) ============
(function() {
  for (var i = 0; i < 2; i++) {
    var y = 0.52 + i * 0.9, w = 1.6 - i * 0.25, d = 1.4 - i * 0.2, h = 0.45;
    var plat = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.hullDark);
    plat.position.set(-L*0.30, y + h/2, 0);
    plat.castShadow = plat.receiveShadow = true;
    ship.add(plat);
    
    // Red railings with gold decorations
    [-1, 1].forEach(function(s) {
      var rail = new THREE.Mesh(new THREE.BoxGeometry(w*0.85, 0.05, 0.035), M.red);
      rail.position.set(-L*0.30, y + h + 0.08, s * d/2);
      ship.add(rail);
      
      for (var dg = 0; dg < 5; dg++) {
        var dot = new THREE.Mesh(new THREE.SphereGeometry(0.025, 4, 4), M.gold);
        dot.position.set(-L*0.30 - w*0.35 + dg * (w*0.7/4), y + h + 0.12, s * d/2);
        ship.add(dot);
      }
    });
  }
})();

// ============ RAILINGS ============
(function() {
  [-1, 1].forEach(function(side) {
    var sz = side * W2 * 0.25;
    var rail = new THREE.Mesh(new THREE.BoxGeometry(L*0.76, 0.05, 0.04), M.red);
    rail.position.set(0, 0.68, sz);
    ship.add(rail);
    
    for (var r = 0; r < 14; r++) {
      var rx = (r/13 - 0.5) * L * 0.75;
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.28, 6), M.red);
      post.position.set(rx, 0.55, sz);
      ship.add(post);
    }
    
    for (var d = 0; d < 10; d++) {
      var dx = (d/9 - 0.5) * L * 0.72;
      var dot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 4, 4), M.gold);
      dot.position.set(dx, 0.71, sz);
      ship.add(dot);
    }
  });
})();

// ============ FLAGS ============
(function() {
  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.2, 6), M.mast);
  pole.position.set(L*0.42, 1.5, 0);
  ship.add(pole);
  
  var f1 = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.3), M.flag);
  f1.position.set(L*0.43, 2.4, 0);
  f1.rotation.z = 0.08;
  ship.add(f1);
  
  var f2 = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.25), M.flag);
  f2.position.set(L*0.33, 2.5, 0.12);
  f2.rotation.z = 0.1;
  f2.rotation.y = 0.12;
  ship.add(f2);
  
  var f3 = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.24), M.flag2);
  f3.position.set(L*0.36, 2.4, -0.1);
  f3.rotation.z = 0.06;
  f3.rotation.y = -0.08;
  ship.add(f3);
})();

// ============ ANCHOR & WINCH ============
(function() {
  var shank = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 1.2, 6), M.iron);
  shank.position.set(L*0.36, -0.05, W2*0.12);
  shank.rotation.z = 0.2;
  ship.add(shank);
  
  var arm = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.04, 0.06), M.iron);
  arm.position.set(L*0.35, -0.65, W2*0.12);
  arm.rotation.z = 0.2;
  ship.add(arm);
  
  var ring = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.025, 6, 8), M.iron);
  ring.position.set(L*0.38, 0.25, W2*0.12);
  ship.add(ring);
  
  var wb = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.12, 8), M.hullDark);
  wb.position.set(L*0.08, 0.42, W2*0.08);
  ship.add(wb);
  
  var wd = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3, 8), M.mast);
  wd.position.set(L*0.08, 0.6, W2*0.08);
  ship.add(wd);
})();

// ============ RIGGING (lines connecting masts) ============
(function() {
  var mastPos = [0.15, 0.35, 0.55, 0.75].map(function(p) { return (p-0.5)*L*0.78; });
  var mastH = [4.0, 4.6, 5.0, 4.2];
  var rigMat = new THREE.LineBasicMaterial({ color: 0x3a2510, transparent: true, opacity: 0.4 });
  
  for (var i = 0; i < 3; i++) {
    var x1 = mastPos[i], x2 = mastPos[i+1];
    var y1 = 0.45 + mastH[i] * 0.85, y2 = 0.45 + mastH[i+1] * 0.85;
    var points = [
      new THREE.Vector3(x1, y1, 0),
      new THREE.Vector3((x1+x2)/2, Math.max(y1,y2) * 0.7, 0),
      new THREE.Vector3(x2, y2, 0)
    ];
    var curve = new THREE.CatmullRomCurve3(points);
    var lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(12));
    var line = new THREE.Line(lineGeo, rigMat);
    ship.add(line);
  }
  
  // Also some vertical rigging lines
  for (var i2 = 0; i2 < 4; i2++) {
    for (var j2 = 0; j2 < 3; j2++) {
      var zOff = (j2 - 1) * 0.15;
      var pts = [
        new THREE.Vector3(mastPos[i2], 0.45 + mastH[i2] * 0.1, zOff),
        new THREE.Vector3(mastPos[i2], 0.45 + mastH[i2] * 0.8, zOff)
      ];
      var lGeo = new THREE.BufferGeometry().setFromPoints(pts);
      var line = new THREE.Line(lGeo, rigMat);
      ship.add(line);
    }
  }
})();

// ============ SHIP INTO SCENE ============
scene.add(ship);

// ============ GROUND ============
var ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 32),
  new THREE.MeshStandardMaterial({ color: 0x080818, roughness: 0.9, metalness: 0.2, transparent: true, opacity: 0.3 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.8;
ground.receiveShadow = true;
scene.add(ground);

// ============ PARTICLES (atmosphere) ============
var pCount = 300;
var pArr = new Float32Array(pCount * 3);
for (var i=0; i<pArr.length; i+=3) {
  pArr[i] = (Math.random()-.5) * 20;
  pArr[i+1] = Math.random() * 7 - 1;
  pArr[i+2] = (Math.random()-.5) * 14;
}
var pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
var particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.025, color: 0xffd700, transparent: true, opacity: 0.35,
  blending: THREE.AdditiveBlending
}));
scene.add(particles);

// ============ ANIMATION ============
function animate() {
  requestAnimationFrame(animate);
  var t = performance.now() * 0.001;
  controls.update();
  ship.rotation.z = Math.sin(t*0.35) * 0.01;
  ship.position.y = Math.sin(t*0.45) * 0.05;
  particles.rotation.y += 0.003;
  renderer.render(scene, camera);
}
animate();

// ============ RESIZE ============
window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
