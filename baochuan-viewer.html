<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>郑和宝船 - 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; font-family: 'SimSun', 'Noto Serif SC', serif; }
  canvas { display: block; }
  #info {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #d4a574; font-size: 28px; text-shadow: 0 0 20px rgba(212,165,116,0.5);
    pointer-events: none; z-index: 10;
  }
  #subtitle {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    color: #8b7355; font-size: 14px; letter-spacing: 4px;
    pointer-events: none; z-index: 10;
  }
  #controls {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 13px; pointer-events: none; z-index: 10;
    text-align: center; line-height: 1.6;
  }
  #error {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ff6b6b; font-size: 14px; text-align: center; max-width: 400px;
    background: rgba(0,0,0,0.7); padding: 20px; border-radius: 8px; display: none;
    z-index: 20; line-height: 1.8;
  }
</style>
</head>
<body>
<div id="info">郑 和 宝 船</div>
<div id="subtitle">明 · 永 乐 年 间 · 下 西 洋</div>
<div id="controls">🖱 拖拽旋转 &nbsp;|&nbsp; 📜 滚轮缩放 &nbsp;|&nbsp; 👆 右键平移</div>
<div id="error"></div>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('error');
  el.style.display = 'block';
  el.innerHTML = '⚠️ 加载出错:<br>' + (e.message || e);
  console.error(e);
});
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>

<script>
document.getElementById('error').style.display = 'none';

// Scene
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 15, 60);

var W = window.innerWidth;
var H = window.innerHeight;
var camera = new THREE.PerspectiveCamera(45, W / H, 0.5, 100);
camera.position.set(8, 3.5, 14);
camera.lookAt(0, 1.5, 0);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.8;
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0xffeedd, 0.7));
var sun = new THREE.DirectionalLight(0xfff5e8, 4);
sun.position.set(10, 14, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -5;
sun.shadow.bias = -0.0001;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0x8899cc, 1));
scene.add(new THREE.DirectionalLight(0xffffff, 1.2));
scene.add(new THREE.DirectionalLight(0x334466, 0.5));

// Materials
var hullMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.65, metalness: 0.05 });
var hullAccent = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.6, metalness: 0.05 });
var deckMat = new THREE.MeshStandardMaterial({ color: 0xA0724A, roughness: 0.55, metalness: 0.03 });
var sailMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.75, metalness: 0.0, side: THREE.DoubleSide });
var sailRib = new THREE.MeshStandardMaterial({ color: 0x6B1010, roughness: 0.65, metalness: 0.05 });
var mastMat = new THREE.MeshStandardMaterial({ color: 0x4A2F10, roughness: 0.55, metalness: 0.05 });
var goldMat = new THREE.MeshStandardMaterial({ color: 0xDAA520, roughness: 0.3, metalness: 0.6 });
var redRail = new THREE.MeshStandardMaterial({ color: 0xCC0000, roughness: 0.45, metalness: 0.1 });
var buildingRed = new THREE.MeshStandardMaterial({ color: 0xCC2222, roughness: 0.4, metalness: 0.1 });
var roofMat = new THREE.MeshStandardMaterial({ color: 0x1A0A05, roughness: 0.5, metalness: 0.05 });
var blueAccent = new THREE.MeshStandardMaterial({ color: 0x2244AA, roughness: 0.4, metalness: 0.15 });
var ironMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.35, metalness: 0.8 });

var ship = new THREE.Group();
var L = 10;

// ===== HULL =====
(function() {
  var W = L * 0.28;
  var hull = new THREE.Mesh(new THREE.BoxGeometry(L * 0.88, 0.7, W * 0.72, 4, 2, 4), hullMat);
  var pos = hull.geometry.attributes.position;
  for (var i = 0; i < pos.count; i++) {
    var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    pos.setXYZ(i, x * (1 - Math.abs(x/(L*0.44))*0.55), y < -0.2 ? -0.2-(y+0.2)*0.4*(1-Math.abs(x/(L*0.44))) : y, z*(y<0?1:0.8));
  }
  hull.geometry.computeVertexNormals();
  hull.position.y = -0.1;
  hull.castShadow = hull.receiveShadow = true;
  ship.add(hull);
  
  var keel = new THREE.Mesh(new THREE.BoxGeometry(L*0.92, 0.35, 0.45), hullAccent);
  keel.position.y = -0.55; keel.castShadow = keel.receiveShadow = true;
  ship.add(keel);
  
  var bw = new THREE.Mesh(new THREE.BoxGeometry(L*0.85, 0.4, W*0.65, 4, 1, 2), hullAccent);
  bw.position.y = 0.35; bw.castShadow = bw.receiveShadow = true;
  ship.add(bw);
  
  var bowTip = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.6, 8, 4), hullMat);
  bowTip.rotation.x = Math.PI/2; bowTip.position.set(L*0.48, -0.15, 0);
  bowTip.scale.set(1,1,0.65); bowTip.castShadow = true;
  ship.add(bowTip);
  
  var rud = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2, 1), hullAccent);
  rud.position.set(-L*0.43, -1.1, 0); rud.castShadow = true;
  ship.add(rud);
})();

// ===== GOLDEN DRAGON HEAD =====
(function() {
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.9, 8), goldMat);
  neck.rotation.x = -0.35; neck.position.set(L*0.51, 0.65, 0); neck.castShadow = true;
  ship.add(neck);
  
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 6), goldMat);
  head.position.set(L*0.56, 1.05, 0); head.scale.set(1.15, 0.85, 0.75); head.castShadow = true;
  ship.add(head);
  
  var snout = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.1, 0.22), goldMat);
  snout.position.set(L*0.59, 0.95, 0); snout.castShadow = true;
  ship.add(snout);
  
  var jaw = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.08, 0.2), goldMat);
  jaw.position.set(L*0.59, 0.78, -0.04); jaw.castShadow = true;
  ship.add(jaw);
  
  var eyeMat = new THREE.MeshStandardMaterial({color:0xFF0000, roughness:0.2, emissive:0x440000});
  [-0.18, 0.18].forEach(function(z) {
    var e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), eyeMat);
    e.position.set(L*0.575, 1.15, z); ship.add(e);
  });
  
  [-0.22, 0.22].forEach(function(z) {
    var w = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.04, 6, 8, Math.PI*0.8), goldMat);
    w.position.set(L*0.58, 0.82, z); w.rotation.x = 0.5; w.rotation.z = z > 0 ? -0.4 : 0.4; w.rotation.y = Math.PI/2;
    ship.add(w);
  });
  
  [-0.2, 0.2].forEach(function(z) {
    var horn = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.45, 6), goldMat);
    horn.position.set(L*0.54, 1.35, z); horn.rotation.z = 0.5; horn.rotation.x = z > 0 ? 0.25 : -0.25;
    ship.add(horn);
  });
  
  for (var i = 0; i < 5; i++) {
    var s = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.25), goldMat);
    s.position.set(L*0.52, 0.85 - i*0.12, 0); ship.add(s);
  }
})();

// ===== MASTS (4, deep red sails) =====
(function() {
  var mastData = [
    { pos: 0.15, h: 4.2, sails: 1 },
    { pos: 0.35, h: 4.8, sails: 2 },
    { pos: 0.55, h: 5.2, sails: 2 },
    { pos: 0.75, h: 4.5, sails: 1 },
  ];
  mastData.forEach(function(m) {
    var x = (m.pos - 0.5) * L * 0.78;
    var baseY = 0.6;
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, m.h, 8), mastMat);
    pole.position.set(x, baseY + m.h/2, 0); pole.castShadow = pole.receiveShadow = true;
    ship.add(pole);
    
    for (var j = 0; j < m.sails; j++) {
      var yy = baseY + m.h * (0.15 + j * 0.5);
      var yw = 0.9 + j * 0.1;
      var yard = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, yw, 6).rotateZ(Math.PI/2), mastMat);
      yard.position.set(x, yy, 0); yard.castShadow = true;
      ship.add(yard);
    }
    
    for (var j = 0; j < m.sails; j++) {
      var sailH = m.h * 0.25;
      var sailW = 0.85;
      var sGeo = new THREE.PlaneGeometry(sailW, sailH, 3, 5);
      var sp = sGeo.attributes.position;
      for (var k = 0; k < sp.count; k++) {
        sp.setZ(k, Math.abs(sp.getX(k)) * 0.08 + sp.getY(k) * 0.01);
      }
      sGeo.computeVertexNormals();
      var sail = new THREE.Mesh(sGeo, sailMat);
      sail.position.set(x, baseY + m.h * (0.15 + (j+0.5) * 0.5), 0);
      sail.castShadow = sail.receiveShadow = true;
      ship.add(sail);
      
      for (var b = 0; b < 4; b++) {
        var by = baseY + m.h * (0.15 + j*0.5 + (b+0.5)*(0.5/4));
        var batten = new THREE.Mesh(new THREE.BoxGeometry(sailW*1.04, 0.025, 0.03), sailRib);
        batten.position.set(x, by, 0.01); ship.add(batten);
      }
    }
  });
})();

// ===== CENTRAL BUILDING =====
(function() {
  var tiers = [
    { y: 0.65, w: 2.2, d: 2.0, h: 1.1 },
    { y: 1.95, w: 1.8, d: 1.6, h: 1.0 },
    { y: 3.15, w: 1.4, d: 1.2, h: 0.9 },
  ];
  tiers.forEach(function(t) {
    var wall = new THREE.Mesh(new THREE.BoxGeometry(t.w, t.h, t.d), buildingRed);
    wall.position.set(0, t.y + t.h/2, 0); wall.castShadow = wall.receiveShadow = true;
    ship.add(wall);
    
    [-1, 1].forEach(function(s) {
      var sz = s * (t.d/2 + 0.01);
      var panel = new THREE.Mesh(new THREE.BoxGeometry(t.w*0.7, t.h*0.4, 0.02), blueAccent);
      panel.position.set(0, t.y + t.h/2, sz); ship.add(panel);
    });
    
    var roofW = t.w + 0.8, roofD = t.d + 0.8;
    var roof = new THREE.Mesh(new THREE.BoxGeometry(roofW, 0.12, roofD), roofMat);
    roof.position.set(0, t.y + t.h + 0.08, 0); roof.castShadow = roof.receiveShadow = true;
    ship.add(roof);
    
    for (var c = 0; c < 4; c++) {
      var a = c*Math.PI/2 + Math.PI/4;
      var ex = Math.cos(a) * (roofW/2 + 0.15);
      var ez = Math.sin(a) * (roofD/2 + 0.15);
      var eave = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 6), roofMat);
      eave.position.set(ex, t.y + t.h + 0.2, ez); eave.rotation.z = Math.PI; eave.castShadow = true;
      ship.add(eave);
    }
    
    [-1, 1].forEach(function(s) {
      var sz = s * (roofD/2 + 0.02);
      var trim = new THREE.Mesh(new THREE.BoxGeometry(roofW*0.95, 0.03, 0.04), goldMat);
      trim.position.set(0, t.y + t.h + 0.16, sz); ship.add(trim);
    });
    
    for (var p = 0; p < 4; p++) {
      var px = (p%2===0?-1:1)*t.w/2*0.85;
      var pz = (p<2?-1:1)*t.d/2*0.85;
      var pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, t.h-0.05, 6), buildingRed);
      pillar.position.set(px, t.y + t.h/2, pz); ship.add(pillar);
    }
  });
  
  var finial = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 6), goldMat);
  finial.position.set(0, 4.35, 0); ship.add(finial);
})();

// ===== STERN PLATFORM (2-level) =====
(function() {
  for (var i = 0; i < 2; i++) {
    var y = 0.65 + i * 1.0, w = 1.8 - i * 0.3, d = 1.6 - i * 0.25, h = 0.5;
    var plat = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), hullAccent);
    plat.position.set(-L*0.32, y + h/2, 0); plat.castShadow = plat.receiveShadow = true;
    ship.add(plat);
    
    [-1, 1].forEach(function(s) {
      var sz = s * d/2;
      var rail = new THREE.Mesh(new THREE.BoxGeometry(w*0.9, 0.06, 0.04), redRail);
      rail.position.set(-L*0.32, y + h + 0.1, sz); ship.add(rail);
      for (var dg = 0; dg < 6; dg++) {
        var dx = (-L*0.32 - w*0.4) + dg * (w*0.8/5);
        var dot = new THREE.Mesh(new THREE.SphereGeometry(0.03, 4, 4), goldMat);
        dot.position.set(dx, y + h + 0.14, sz); ship.add(dot);
      }
    });
    [-1, 1].forEach(function(s) {
      var sx = s * (w/2) - L*0.32;
      var rail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, d*0.9), redRail);
      rail.position.set(sx, y + h + 0.1, 0); ship.add(rail);
    });
  }
})();

// ===== DECK =====
(function() {
  var W = L * 0.28;
  var deck = new THREE.Mesh(new THREE.BoxGeometry(L*0.82, 0.06, W*0.55), deckMat);
  deck.position.y = 0.5; deck.receiveShadow = true;
  ship.add(deck);
  
  for (var i = 0; i < 14; i++) {
    var px = (i/13 - 0.5) * L * 0.8;
    var plank = new THREE.Mesh(new THREE.BoxGeometry(L*0.8/14*0.9, 0.008, W*0.5), deckMat);
    plank.position.set(px, 0.54, 0); ship.add(plank);
  }
  
  [-1, 1].forEach(function(side) {
    var sz = side * W*0.28;
    var rail = new THREE.Mesh(new THREE.BoxGeometry(L*0.8, 0.06, 0.05), redRail);
    rail.position.set(0, 0.72, sz); ship.add(rail);
    
    for (var r = 0; r < 16; r++) {
      var rx = (r/15 - 0.5) * L * 0.79;
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3, 6), redRail);
      post.position.set(rx, 0.58, sz); ship.add(post);
    }
    
    for (var d = 0; d < 12; d++) {
      var dx = (d/11 - 0.5) * L * 0.76;
      var dot = new THREE.Mesh(new THREE.SphereGeometry(0.025, 4, 4), goldMat);
      dot.position.set(dx, 0.75, sz); ship.add(dot);
    }
  });
})();

// ===== FLAGS =====
(function() {
  var flagMat = new THREE.MeshStandardMaterial({color:0xCC0000, roughness:0.4, side:THREE.DoubleSide});
  var flagMat2 = new THREE.MeshStandardMaterial({color:0xBB0000, roughness:0.4, side:THREE.DoubleSide});
  
  var bowPole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2, 8), mastMat);
  bowPole.position.set(L*0.45, 1.6, 0); ship.add(bowPole);
  
  var f1 = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.35), flagMat);
  f1.position.set(L*0.46, 2.5, 0); f1.rotation.z = 0.1; ship.add(f1);
  
  var f2 = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), flagMat);
  f2.position.set(L*0.35, 2.6, 0.15); f2.rotation.z = 0.12; f2.rotation.y = 0.15; ship.add(f2);
  
  var f3 = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.28), flagMat2);
  f3.position.set(L*0.38, 2.5, -0.12); f3.rotation.z = 0.08; f3.rotation.y = -0.1; ship.add(f3);
})();

// ===== ANCHOR =====
(function() {
  var shank = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.3, 8), ironMat);
  shank.position.set(L*0.38, -0.1, L*0.28*0.15); shank.rotation.z = 0.25; ship.add(shank);
  
  var arm = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 0.07), ironMat);
  arm.position.set(L*0.37, -0.75, L*0.28*0.15); arm.rotation.z = 0.25; ship.add(arm);
  
  var ring = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 8, 8), ironMat);
  ring.position.set(L*0.4, 0.3, L*0.28*0.15); ship.add(ring);
  
  var winchBase = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.15, 8), hullAccent);
  winchBase.position.set(L*0.1, 0.45, L*0.28*0.1); ship.add(winchBase);
  var winchDrum = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.35, 8), mastMat);
  winchDrum.position.set(L*0.1, 0.65, L*0.28*0.1); ship.add(winchDrum);
})();

// Ground
var ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 32),
  new THREE.MeshStandardMaterial({color:0x0a1628, roughness:0.9, metalness:0.3, transparent:true, opacity:0.35})
);
ground.rotation.x = -Math.PI/2; ground.position.y = -2; ground.receiveShadow = true;
scene.add(ground);

// Ship into scene
scene.add(ship);

// Particles
var pGeo = new THREE.BufferGeometry();
var pArr = new Float32Array(200*3);
for (var i=0;i<pArr.length;i+=3) {
  pArr[i]=(Math.random()-.5)*18; pArr[i+1]=Math.random()*8-1; pArr[i+2]=(Math.random()-.5)*12;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pArr,3));
var particles = new THREE.Points(pGeo, new THREE.PointsMaterial({size:0.03, color:0xffd700, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending}));
scene.add(particles);

// Render loop
function animate() {
  requestAnimationFrame(animate);
  var t = performance.now() * 0.001;
  controls.update();
  ship.rotation.z = Math.sin(t*0.4)*0.012;
  ship.position.y = Math.sin(t*0.5)*0.06;
  particles.rotation.y += 0.016 * 0.04;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('🏴‍☠️ 郑和宝船 3D Viewer loaded');
document.getElementById('error').style.display = 'none';
</script>
</body>
</html>
